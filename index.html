<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POLRAD MAPPING — Editor</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<link
    rel="stylesheet"
    href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.0/dist/leaflet-geoman.css"
/>

<style>

/* =========================================================
   GENERAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

#map {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 340px;
}


/* =========================================================
   LOGIN
========================================================= */

#loginScreen {
    position: fixed;
    inset: 0;

    background: #202124;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 10000;
}

#loginBox {
    width: 340px;

    background: white;

    padding: 30px;

    border-radius: 12px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.35);

    text-align: center;
}

#loginBox h2 {
    margin: 0 0 24px 0;
    color: #202124;
}

#passwordInput {
    width: 100%;

    padding: 12px;

    border: 1px solid #dadce0;

    border-radius: 6px;

    font-size: 15px;

    outline: none;
}

#passwordInput:focus {
    border-color: #1a73e8;
}

#loginButton {
    width: 100%;

    margin-top: 12px;

    padding: 12px;

    border: none;

    border-radius: 6px;

    background: #1a73e8;

    color: white;

    font-size: 15px;

    cursor: pointer;
}

#loginButton:hover {
    background: #1769d1;
}

#loginError {
    display: none;

    margin-top: 12px;

    color: #d93025;

    font-size: 14px;
}


/* =========================================================
   SIDEBAR
========================================================= */

#sidebar {

    position: fixed;

    top: 0;
    left: 0;
    bottom: 0;

    width: 340px;

    background: white;

    z-index: 5000;

    border-right: 1px solid #dadce0;

    display: none;

    flex-direction: column;
}


/* HEADER */

#sidebarHeader {

    height: 64px;

    display: flex;

    align-items: center;

    padding: 0 18px;

    border-bottom: 1px solid #e0e0e0;
}

#sidebarTitle {

    font-size: 18px;

    font-weight: 500;

    color: #202124;
}

#sidebarSubtitle {

    font-size: 12px;

    color: #70757a;

    margin-left: auto;
}


/* =========================================================
   SEARCH
========================================================= */

#searchArea {

    padding: 10px 12px;

    border-bottom: 1px solid #e0e0e0;
}

#searchBox {

    display: flex;

    align-items: center;

    background: #f1f3f4;

    border-radius: 24px;

    padding: 0 10px;
}

#searchInput {

    flex: 1;

    border: none;

    outline: none;

    background: transparent;

    padding: 11px 8px;

    font-size: 14px;
}

#searchButton {

    border: none;

    background: transparent;

    cursor: pointer;

    font-size: 18px;

    padding: 5px;
}


/* =========================================================
   DRAWING SECTION
========================================================= */

#drawingSection {

    padding: 12px;

    border-bottom: 1px solid #e0e0e0;
}

.sectionTitle {

    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: 0.5px;

    color: #70757a;

    margin-bottom: 8px;
}

#drawPolygonButton {

    width: 100%;

    padding: 11px;

    border: 1px solid #dadce0;

    border-radius: 6px;

    background: white;

    color: #202124;

    cursor: pointer;

    font-size: 14px;

    text-align: left;
}

#drawPolygonButton:hover {

    background: #f8f9fa;
}

#drawPolygonButton.active {

    background: #e8f0fe;

    border-color: #1a73e8;

    color: #1a73e8;
}


/* =========================================================
   TARGET LAYER
========================================================= */

#targetLayerArea {

    margin-top: 10px;

    display: none;
}

#targetLayerSelect {

    width: 100%;

    padding: 9px;

    border: 1px solid #dadce0;

    border-radius: 6px;

    background: white;

    font-size: 13px;
}


/* =========================================================
   SELECTED POLYGON
========================================================= */

#selectedSection {

    display: none;

    padding: 12px;

    border-bottom: 1px solid #e0e0e0;

    background: #f8f9fa;
}

#selectedName {

    font-size: 14px;

    font-weight: 500;

    margin-bottom: 8px;

    color: #202124;
}

#selectedLayerSelect {

    width: 100%;

    padding: 8px;

    border: 1px solid #dadce0;

    border-radius: 6px;

    background: white;

    font-size: 13px;
}

#deleteSelectedButton {

    width: 100%;

    margin-top: 8px;

    padding: 8px;

    border: 1px solid #dadce0;

    border-radius: 6px;

    background: white;

    color: #d93025;

    cursor: pointer;
}

#deleteSelectedButton:hover {

    background: #fce8e6;
}


/* =========================================================
   LAYERS
========================================================= */

#layersArea {

    flex: 1;

    overflow-y: auto;

    padding-bottom: 10px;
}

#layersHeader {

    padding: 14px 14px 8px 14px;

    font-size: 12px;

    text-transform: uppercase;

    color: #70757a;

    letter-spacing: 0.5px;
}

.layerItem {

    display: flex;

    align-items: center;

    min-height: 48px;

    padding: 7px 12px;

    cursor: pointer;

    border-bottom: 1px solid #f1f3f4;
}

.layerItem:hover {

    background: #f8f9fa;
}

.layerVisibility {

    width: 28px;

    border: none;

    background: transparent;

    cursor: pointer;

    font-size: 16px;
}

.layerColor {

    width: 14px;
    height: 14px;

    border-radius: 3px;

    margin: 0 9px;

    flex-shrink: 0;
}

.layerName {

    flex: 1;

    font-size: 13px;

    color: #202124;
}

.layerDrawButton {

    border: none;

    background: transparent;

    cursor: pointer;

    font-size: 16px;

    opacity: 0;

}

.layerItem:hover .layerDrawButton {

    opacity: 1;
}


/* =========================================================
   BOTTOM ACTION BAR
========================================================= */

#actionBar {

    border-top: 1px solid #dadce0;

    padding: 8px;

    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 5px;
}

.actionButton {

    border: none;

    background: white;

    padding: 9px 5px;

    border-radius: 5px;

    cursor: pointer;

    font-size: 12px;

    color: #3c4043;
}

.actionButton:hover {

    background: #f1f3f4;
}

#publishButton {

    background: #1a73e8;

    color: white;
}

#publishButton:hover {

    background: #1769d1;
}


/* =========================================================
   MAP CONTROLS
========================================================= */

.leaflet-control-zoom {

    margin-right: 12px !important;

    margin-bottom: 12px !important;
}

.leaflet-control-layers {

    margin-top: 12px !important;

    margin-right: 12px !important;
}


/* =========================================================
   GEOMAN
========================================================= */

.leaflet-bottom.leaflet-left {

    margin-left: 12px;

    margin-bottom: 12px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 750px) {

    #sidebar {

        width: 290px;
    }

    #map {

        left: 290px;
    }

}

@media (max-width: 550px) {

    #sidebar {

        width: 100%;

        height: 330px;

        bottom: auto;

        border-right: none;

        border-bottom: 1px solid #dadce0;
    }

    #map {

        left: 0;

        top: 330px;
    }

    #layersArea {

        display: none;
    }

    #sidebarSubtitle {

        display: none;
    }

}


/* =========================================================
   SCROLLBAR
========================================================= */

#layersArea::-webkit-scrollbar {

    width: 7px;
}

#layersArea::-webkit-scrollbar-thumb {

    background: #c5c7c9;

    border-radius: 5px;
}

</style>

</head>

<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginScreen">

    <div id="loginBox">

        <h2>POLRAD MAPPING</h2>

        <input
            id="passwordInput"
            type="password"

        >

        <button id="loginButton">

        </button>

        <div id="loginError">

</div>


<!-- =====================================================

<div id="sidebar">

    <div id="sidebarHeader">

        <div id="sidebarTitle">

        </div>

        <div id="sidebarSubtitle">

        </div>

    </div>


    <!-- SEARCH -->

    <div id="searchArea">

    <div id="drawingSection">

        <div class="sectionTitle">

            <select id="targetLayerSelect">

        </div>

    <div id="selectedSection">

        </div>

        <div class="sectionTitle">
            Polygon layer

        <select id="selectedLayerSelect">

            <option value="Ukrainian-controlled territory">
                🔵 Ukrainian-controlled territory

            <option value="Russian-controlled territory">

            </option>

            <option value="Ukrainian advances">

            </option>

        <div

<!-- =====================================================
     MAP

<div id="map"></div>


<!-- =====================================================
     SCRIPTS
===================================================== -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.0/dist/leaflet-geoman.min.js"></script>


<script>

/* =========================================================
   CONFIG
========================================================= */

const WORKER_URL =
    "https://polrad-editor-api.streetviewfun066.workers.dev/";


const DATA_FILES = {

    "Russian-controlled territory":
        "data/Russian-controlled%20territory.geojson",

    "Ukrainian-controlled territory":
        "data/Ukrainian-controlled%20territory.geojson",

    "Ukrainian advances":
        "data/Ukrainian%20advances.geojson",

    "Russian advances":
        "data/Russian%20advances.geojson",

    "Territories regained in the last month":
        "data/Territories%20regained%20in%20the%20last%20month.geojson"

};


const COLORS = {

    "Russian-controlled territory":
        "#d94b4b",

    "Ukrainian-controlled territory":
        "#4b83d9",

    "Ukrainian advances":
        "#6fb7ff",

    "Russian advances":
        "#f1c40f",

    "Territories regained in the last month":
        "#42b883"

};


/* =========================================================
   VARIABLES
========================================================= */

let map;

let loadedLayers = {};

let selectedLayer = null;

let selectedLayerName = null;

let drawingPolygon = false;

let polygonCounter = 0;

let history = [];

let historyIndex = -1;


/* =========================================================
   LOGIN
========================================================= */

document
    .getElementById("loginButton")
    .addEventListener(
        "click",
        login
    );


document
    .getElementById("passwordInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                login();

            }

        }
    );


async function login() {

    const password =
        document
            .getElementById("passwordInput")
            .value;

    const error =
        document
            .getElementById("loginError");


    error.style.display = "none";


    try {

        const response =
            await fetch(
                WORKER_URL,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            action: "login",

                            password:
                                password

                        })

                }
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            error.style.display =
                "block";

            return;

        }


        document
            .getElementById(
                "loginScreen"
            )
            .style.display = "none";


        document
            .getElementById(
                "sidebar"
            )
            .style.display = "flex";


        initializeMap();

    }

    catch (error) {

        console.error(error);

        error =
            document.getElementById(
                "loginError"
            );

        error.textContent =
            "Connection error.";

        error.style.display =
            "block";

    }

}


/* =========================================================
   INITIALIZE MAP
========================================================= */

async function initializeMap() {

    map =
        L.map(
            "map",
            {
                zoomControl: false
            }
        )
        .setView(
            [48.5, 32],
            6
        );


    /* =====================================================
       BASEMAPS
    ===================================================== */

    const hybridImagery =
        L.tileLayer(

            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

            {
                attribution:
                    "Tiles © Esri",

                maxZoom: 19

            }

        );


    const hybridLabels =
        L.tileLayer(

            "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",

            {
                attribution:
                    "Labels © Esri",

                maxZoom: 19

            }

        );


    const hybrid =
        L.layerGroup([
            hybridImagery,
            hybridLabels
        ]);


    const osm =
        L.tileLayer(

            "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

            {
                attribution:
                    "© OpenStreetMap contributors",

                maxZoom: 19

            }

        );


    const topo =
        L.tileLayer(

            "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",

            {
                attribution:
                    "© OpenStreetMap contributors, SRTM | OpenTopoMap",

                maxZoom: 17

            }

        );


    hybrid.addTo(map);


    L.control.layers(

        {

            "🛰 Hybrid":
                hybrid,

            "🗺 OpenStreetMap":
                osm,

            "⛰ OpenTopoMap":
                topo

        },

        null,

        {
            position: "topright"
        }

    ).addTo(map);


    L.control.zoom({

        position:
            "bottomright"

    }).addTo(map);


    /* =====================================================
       GEOMAN
    ===================================================== */

    map.pm.addControls({

        position:
            "bottomleft",

        drawMarker:
            false,

        drawCircleMarker:
            false,

        drawPolyline:
            false,

        drawRectangle:
            false,

        drawCircle:
            false,

        drawText:
            false,

        editMode:
            false,

        dragMode:
            false,

        cutPolygon:
            false,

        removalMode:
            false

    });


    /* =====================================================
       DRAW EVENTS
    ===================================================== */

    map.on(
        "pm:drawstart",
        function() {

            drawingPolygon =
                true;


            deselectPolygon();


            disableAllPolygonEditing();

        }
    );


    map.on(
        "pm:create",
        function(event) {

            const polygon =
                event.layer;


            createPolygonInSelectedLayer(
                polygon
            );


            drawingPolygon =
                false;

        }
    );


    map.on(
        "pm:drawend",
        function() {

            drawingPolygon =
                false;

        }
    );


    /* =====================================================
       LOAD DATA
    ===================================================== */

    for (
        const [name, url]
        of Object.entries(DATA_FILES)
    ) {

        await loadGeoJSON(
            name,
            url
        );

    }


    setupSidebar();


    saveHistory();

}


/* =========================================================
   LOAD GEOJSON
========================================================= */

async function loadGeoJSON(
    name,
    url
) {

    try {

        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        const layer =
            L.geoJSON(
                data,
                {

                    style:
                        getStyle(name),

                    onEachFeature:
                        function(
                            feature,
                            polygon
                        ) {

                            setupPolygon(
                                polygon,
                                name
                            );

                        }

                }
            );


        layer.addTo(map);


        loadedLayers[name] =
            layer;

    }

    catch (error) {

        console.error(
            "Could not load " +
            name,
            error
        );

    }

}


/* =========================================================
   STYLE
========================================================= */

function getStyle(name) {

    return {

        color:
            COLORS[name],

        fillColor:
            COLORS[name],

        fillOpacity:
            0.55,

        weight:
            2

    };

}


/* =========================================================
   SETUP POLYGON
========================================================= */

function setupPolygon(
    polygon,
    layerName
) {

    polygon._polradLayer =
        layerName;


    polygon.on(
        "click",
        function(event) {

            L.DomEvent.stopPropagation(
                event
            );


            /*
             * IMPORTANT:
             * While drawing a new polygon,
             * existing polygons cannot be selected.
             */

            if (drawingPolygon) {

                return;

            }


            selectPolygon(
                polygon
            );

        }
    );


    polygon.on(
        "pm:edit",
        function() {

            if (!drawingPolygon) {

                saveHistory();

            }

        }
    );

}


/* =========================================================
   SELECT POLYGON
========================================================= */

function selectPolygon(
    polygon
) {

    if (drawingPolygon) {

        return;

    }


    deselectPolygon();


    selectedLayer =
        polygon;


    selectedLayerName =
        polygon._polradLayer;


    try {

        polygon.pm.enable();

    }

    catch (e) {}


    polygon.setStyle({

        weight:
            4

    });


    const properties =
        polygon.feature &&
        polygon.feature.properties;


    const polygonName =
        properties &&
        properties.Name
            ? properties.Name
            : "Selected polygon";


    document
        .getElementById(
            "selectedName"
        )
        .textContent =
            polygonName;


    document
        .getElementById(
            "selectedLayerSelect"
        )
        .value =
            selectedLayerName;


    document
        .getElementById(
            "selectedSection"
        )
        .style.display =
            "block";

}


/* =========================================================
   DESELECT
========================================================= */

function deselectPolygon() {

    if (selectedLayer) {

        try {

            selectedLayer.pm.disable();

        }

        catch (e) {}


        if (selectedLayerName) {

            selectedLayer.setStyle(
                getStyle(
                    selectedLayerName
                )
            );

        }

    }


    selectedLayer =
        null;

    selectedLayerName =
        null;


    document
        .getElementById(
            "selectedSection"
        )
        .style.display =
            "none";

}


/* =========================================================
   DISABLE ALL EDITING
========================================================= */

function disableAllPolygonEditing() {

    for (
        const layer
        of Object.values(
            loadedLayers
        )
    ) {

        layer.eachLayer(
            function(polygon) {

                try {

                    polygon.pm.disable();

                }

                catch (e) {}

                polygon.setStyle({

                    weight: 2

                });

            }
        );

    }

}


/* =========================================================
   CREATE NEW POLYGON
========================================================= */

function createPolygonInSelectedLayer(
    polygon
) {

    const targetName =
        document
            .getElementById(
                "targetLayerSelect"
            )
            .value;


    const targetLayer =
        loadedLayers[
            targetName
        ];


    if (!targetLayer) {

        map.removeLayer(
            polygon
        );

        return;

    }


    polygonCounter++;


    polygon.feature = {

        type:
            "Feature",

        properties: {

            Name:
                "New polygon " +
                polygonCounter,

            editorCreated:
                true

        },

        geometry:
            polygon.toGeoJSON()
                .geometry

    };


    polygon._polradLayer =
        targetName;


    /*
     * REMOVE FROM MAP TEMPORARILY.
     *
     * Then put it inside the actual
     * GeoJSON layer.
     */

    map.removeLayer(
        polygon
    );


    /*
     * APPLY THE EXACT DEFAULT
     * COLOR OF THE TARGET LAYER.
     */

    polygon.setStyle(
        getStyle(
            targetName
        )
    );


    targetLayer.addLayer(
        polygon
    );


    setupPolygon(
        polygon,
        targetName
    );


    drawingPolygon =
        false;


    /*
     * Now select the new polygon.
     */

    selectPolygon(
        polygon
    );


    saveHistory();

}


/* =========================================================
   CHANGE POLYGON LAYER
========================================================= */

document
    .getElementById(
        "selectedLayerSelect"
    )
    .addEventListener(
        "change",
        function() {

            if (!selectedLayer) {

                return;

            }


            const newLayerName =
                this.value;


            const oldLayerName =
                selectedLayerName;


            if (
                newLayerName ===
                oldLayerName
            ) {

                return;

            }


            const oldLayer =
                loadedLayers[
                    oldLayerName
                ];


            const newLayer =
                loadedLayers[
                    newLayerName
                ];


            if (!oldLayer || !newLayer) {

                return;

            }


            /*
             * Remove from old layer.
             */

            oldLayer.removeLayer(
                selectedLayer
            );


            /*
             * Add to new layer.
             */

            newLayer.addLayer(
                selectedLayer
            );


            /*
             * Update internal layer.
             */

            selectedLayerName =
                newLayerName;


            selectedLayer._polradLayer =
                newLayerName;


            /*
             * Update color immediately.
             */

            selectedLayer.setStyle(
                getStyle(
                    newLayerName
                )
            );


            /*
             * Keep it selected.
             */

            selectedLayer.setStyle({

                weight:
                    4

            });


            saveHistory();

        }
    );


/* =========================================================
   DELETE SELECTED POLYGON
========================================================= */

document
    .getElementById(
        "deleteSelectedButton"
    )
    .addEventListener(
        "click",
        function() {

            if (!selectedLayer) {

                return;

            }


            const polygon =
                selectedLayer;


            for (
                const layer
                of Object.values(
                    loadedLayers
                )
            ) {

                if (
                    layer.hasLayer(
                        polygon
                    )
                ) {

                    layer.removeLayer(
                        polygon
                    );

                    break;

                }

            }


            selectedLayer =
                null;

            selectedLayerName =
                null;


            document
                .getElementById(
                    "selectedSection"
                )
                .style.display =
                    "none";


            saveHistory();

        }
    );


/* =========================================================
   DRAW BUTTON
========================================================= */

document
    .getElementById(
        "drawPolygonButton"
    )
    .addEventListener(
        "click",
        function() {

            startDrawing(
                document
                    .getElementById(
                        "targetLayerSelect"
                    )
                    .value
            );

        }
    );


function startDrawing(
    layerName
) {

    if (drawingPolygon) {

        return;

    }


    document
        .getElementById(
            "targetLayerSelect"
        )
        .value =
            layerName;


    deselectPolygon();


    disableAllPolygonEditing();


    drawingPolygon =
        true;


    const button =
        document
            .getElementById(
                "drawPolygonButton"
            );


    button.classList.add(
        "active"
    );


    /*
     * Start Geoman polygon drawing.
     */

    map.pm.enableDraw(
        "Polygon",
        {

            snappable:
                false

        }
    );

}


/* =========================================================
   STOP DRAWING BUTTON STATE
========================================================= */

mapClickHandler = null;


/* =========================================================
   SIDEBAR
========================================================= */

function setupSidebar() {

    /*
     * Layer visibility
     */

    document
        .querySelectorAll(
            ".layerVisibility"
        )
        .forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function(event) {

                        event.stopPropagation();


                        const name =
                            this.dataset.visibility;


                        const layer =
                            loadedLayers[
                                name
                            ];


                        if (
                            map.hasLayer(
                                layer
                            )
                        ) {

                            map.removeLayer(
                                layer
                            );

                            this.textContent =
                                "○";

                        }

                        else {

                            layer.addTo(
                                map
                            );

                            this.textContent =
                                "👁";

                        }

                    }
                );

            }
        );


    /*
     * Click layer row:
     * choose it as the drawing target.
     */

    document
        .querySelectorAll(
            ".layerItem"
        )
        .forEach(
            function(item) {

                item.addEventListener(
                    "click",
                    function() {

                        const name =
                            this.dataset.layer;


                        document
                            .getElementById(
                                "targetLayerSelect"
                            )
                            .value =
                                name;


                        document
                            .getElementById(
                                "targetLayerArea"
                            )
                            .style.display =
                                "block";

                    }
                );

            }
        );


    /*
     * Small + button beside each layer.
     */

    document
        .querySelectorAll(
            ".layerDrawButton"
        )
        .forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function(event) {

                        event.stopPropagation();


                        const name =
                            this.dataset.draw;


                        startDrawing(
                            name
                        );

                    }
                );

            }
        );

}

/* =========================================================
   UNDO / REDO DATA
========================================================= */

function getCurrentData() {

    const result = {};


    for (
        const [name, layer]
        of Object.entries(
            loadedLayers
        )
    ) {

        result[name] =
            layer.toGeoJSON();

    }


    return result;

}


/* =========================================================
   SAVE HISTORY
========================================================= */

function saveHistory() {

    if (
        !map ||
        Object.keys(
            loadedLayers
        ).length === 0
    ) {

        return;

    }


    const snapshot =
        JSON.stringify(
            getCurrentData()
        );


    /*
     * Don't create duplicate history entries.
     */

    if (
        historyIndex >= 0 &&
        history[
            historyIndex
        ] === snapshot
    ) {

        return;

    }


    history =
        history.slice(
            0,
            historyIndex + 1
        );


    history.push(
        snapshot
    );


    historyIndex =
        history.length - 1;

}


/* =========================================================
   RESTORE HISTORY
========================================================= */

function restoreHistory(
    snapshot
) {

    const data =
        JSON.parse(
            snapshot
        );


    deselectPolygon();


    for (
        const [name, layer]
        of Object.entries(
            loadedLayers
        )
    ) {

        layer.clearLayers();


        const restored =
            L.geoJSON(
                data[name],
                {

                    style:
                        getStyle(name),

                    onEachFeature:
                        function(
                            feature,
                            polygon
                        ) {

                            setupPolygon(
                                polygon,
                                name
                            );

                        }

                }
            );


        restored.eachLayer(
            function(polygon) {

                layer.addLayer(
                    polygon
                );

            }
        );

    }

}


/* =========================================================
   UNDO
========================================================= */

document
    .getElementById(
        "undoButton"
    )
    .addEventListener(
        "click",
        function() {

            if (
                historyIndex <= 0
            ) {

                return;

            }


            historyIndex--;


            restoreHistory(
                history[
                    historyIndex
                ]
            );

        }
    );


/* =========================================================
   REDO
========================================================= */

document
    .getElementById(
        "redoButton"
    )
    .addEventListener(
        "click",
        function() {

            if (
                historyIndex >=
                history.length - 1
            ) {

                return;

            }


            historyIndex++;


            restoreHistory(
                history[
                    historyIndex
                ]
            );

        }
    );


/* =========================================================
   SAVE
========================================================= */

document
    .getElementById(
        "saveButton"
    )
    .addEventListener(
        "click",
        function() {

            localStorage.setItem(

                "polrad_editor_data",

                JSON.stringify(
                    getCurrentData()
                )

            );


            alert(
                "Changes saved locally."
            );

        }
    );


/* =========================================================
   DOWNLOAD
========================================================= */

document
    .getElementById(
        "downloadButton"
    )
    .addEventListener(
        "click",
        function() {

            const data =
                getCurrentData();


            const blob =
                new Blob(
                    [
                        JSON.stringify(
                            data,
                            null,
                            2
                        )
                    ],
                    {
                        type:
                            "application/json"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                "polrad-edited-data.json";


            link.click();


            URL.revokeObjectURL(
                url
            );

        }
    );


/* =========================================================
   RESET
========================================================= */

document
    .getElementById(
        "resetButton"
    )
    .addEventListener(
        "click",
        async function() {

            if (
                !confirm(
                    "Reset all changes?"
                )
            ) {

                return;

            }


            deselectPolygon();


            for (
                const [name, url]
                of Object.entries(
                    DATA_FILES
                )
            ) {

                const response =
                    await fetch(url);


                const data =
                    await response.json();


                const layer =
                    loadedLayers[
                        name
                    ];


                layer.clearLayers();


                const restored =
                    L.geoJSON(
                        data,
                        {

                            style:
                                getStyle(name),

                            onEachFeature:
                                function(
                                    feature,
                                    polygon
                                ) {

                                    setupPolygon(
                                        polygon,
                                        name
                                    );

                                }

                        }
                    );


                restored.eachLayer(
                    function(polygon) {

                        layer.addLayer(
                            polygon
                        );

                    }
                );

            }


            history = [];

            historyIndex = -1;

            saveHistory();

        }
    );


/* =========================================================
   PUBLISH
========================================================= */

document
    .getElementById(
        "publishButton"
    )
    .addEventListener(
        "click",
        async function() {

            if (
                !confirm(
                    "Publish the current map to the public map?"
                )
            ) {

                return;

            }


            const files =
                getCurrentData();


            try {

                const response =
                    await fetch(
                        WORKER_URL,
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    action:
                                        "publish",

                                    files:
                                        files

                                })

                        }
                    );


                const result =
                    await response.json();


                if (
                    !response.ok
                ) {

                    alert(
                        "Publish failed: " +
                        (
                            result.error ||
                            "Unknown error"
                        )
                    );

                    return;

                }


                alert(
                    "Published successfully!"
                );

            }

            catch (error) {

                console.error(
                    error
                );


                alert(
                    "Publish failed."
                );

            }

        }
    );


/* =========================================================
   SEARCH
========================================================= */

document
    .getElementById(
        "searchButton"
    )
    .addEventListener(
        "click",
        searchLocation
    );


document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                searchLocation();

            }

        }
    );


async function searchLocation() {

    const query =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim();


    if (!query) {

        return;

    }


    /*
     * Coordinates:
     * 48.123, 37.456
     */

    const coordinateMatch =
        query.match(
            /^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/
        );


    if (coordinateMatch) {

        const lat =
            parseFloat(
                coordinateMatch[1]
            );

        const lng =
            parseFloat(
                coordinateMatch[2]
            );


        if (
            lat >= -90 &&
            lat <= 90 &&
            lng >= -180 &&
            lng <= 180
        ) {

            map.setView(
                [lat, lng],
                12
            );


            L.marker(
                [lat, lng]
            )
            .addTo(map)
            .bindPopup(
                lat +
                ", " +
                lng
            )
            .openPopup();


            return;

        }

    }


    /*
     * Place search
     */

    try {

        const response =
            await fetch(

                "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
                encodeURIComponent(
                    query
                ),

                {

                    headers: {

                        "Accept-Language":
                            "en"

                    }

                }

            );


        const results =
            await response.json();


        if (
            !results.length
        ) {

            alert(
                "Location not found."
            );

            return;

        }


        const result =
            results[0];


        const lat =
            parseFloat(
                result.lat
            );

        const lon =
            parseFloat(
                result.lon
            );


        map.setView(
            [lat, lon],
            12
        );


        L.marker(
            [lat, lon]
        )
        .addTo(map)
        .bindPopup(
            result.display_name
        )
        .openPopup();

    }

    catch (error) {

        console.error(
            error
        );


        alert(
            "Search failed."
        );

    }

}


/* =========================================================
   DRAW BUTTON STATE
========================================================= */

mapClickHandler = null;


mapReadyFix = setInterval(
    function() {

        if (!map) {

            return;

        }


        clearInterval(
            mapReadyFix
        );


        map.on(
            "pm:drawstart",
            function() {

                document
                    .getElementById(
                        "drawPolygonButton"
                    )
                    .classList.add(
                        "active"
                    );

            }
        );


        map.on(
            "pm:create",
            function() {

                document
                    .getElementById(
                        "drawPolygonButton"
                    )
                    .classList.remove(
                        "active"
                    );

            }
        );


        map.on(
            "pm:drawend",
            function() {

                drawingPolygon =
                    false;


                document
                    .getElementById(
                        "drawPolygonButton"
                    )
                    .classList.remove(
                        "active"
                    );

            }
        );

    },
    100
);
