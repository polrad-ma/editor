<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POLRAD map editor 4.4</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.2/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.0/dist/leaflet-geoman.css">

  <style>
    * { box-sizing: border-box; }

    html, body, #map {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      position: absolute;
      left: 340px;
      width: calc(100% - 340px);
    }

    #side {
      display: none;
      position: absolute;
      z-index: 2000;
      left: 0;
      top: 0;
      bottom: 0;
      width: 340px;
      background: #fff;
      border-right: 1px solid #ddd;
      overflow: auto;
    }

    .head {
      height: 62px;
      padding: 12px 15px;
      border-bottom: 1px solid #ddd;
      font-weight: 600;
      font-size: 16px;
    }

    .body { padding: 12px; }

    .tabs {
      display: flex;
      border-bottom: 1px solid #ddd;
      background: #f7f8f9;
    }

    .tab {
      flex: 1;
      border: 0;
      border-bottom: 2px solid transparent;
      background: none;
      padding: 10px 6px;
      font-size: 13px;
      font-weight: 600;
      color: #777;
      cursor: pointer;
    }

    .tab:hover { color: #333; }

    .tab.active {
      color: #1a73e8;
      border-bottom-color: #1a73e8;
      background: #fff;
    }

    .actions {
      display: flex;
      gap: 5px;
      margin-bottom: 9px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 6px;
      padding: 7px 9px;
      cursor: pointer;
    }

    .primary {
      background: #1a73e8;
      color: #fff;
      border-color: #1a73e8;
    }

    #search {
      width: 100%;
      height: 36px;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 0 9px;
      margin-bottom: 9px;
    }

    .box {
      background: #f7f8f9;
      border: 1px solid #ddd;
      border-radius: 7px;
      padding: 9px;
      margin-bottom: 10px;
    }

    .box label {
      font-size: 11px;
      color: #777;
    }

    .box select {
      width: 100%;
      height: 34px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fff;
    }

    .box button {
      width: 100%;
      margin-top: 7px;
    }

    .layer {
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 5px;
      margin: 2px 0;
    }

    .layer.drop {
      background: #e8f0fe;
      border-color: #1a73e8;
    }

    .lh {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
    }

    .arrow {
      border: 0;
      background: none;
      cursor: pointer;
      width: 20px;
    }

    .vis {
      margin: 0;
      cursor: pointer;
      flex-shrink: 0;
    }

    .sw {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid #aaa;
    }

    .lname {
      flex: 1;
      font-size: 13px;
      cursor: pointer;
    }

    .lname.off {
      color: #999;
      text-decoration: line-through;
    }

    .count {
      font-size: 11px;
      color: #888;
    }

    .plist { margin-left: 27px; }

    .item {
      display: flex;
      gap: 6px;
      padding: 6px;
      border-radius: 5px;
      font-size: 12px;
      cursor: grab;
      border: 1px solid transparent;
      user-select: none;
    }

    .item:active { cursor: grabbing; }

    .item:hover { background: #f1f3f4; }

    .item.selected {
      background: #e8f0fe;
      border-color: #c5d7f7;
      color: #174ea6;
    }

    .item.dragging { opacity: .4; }

    .grip {
      color: #999;
      letter-spacing: -2px;
    }

    .section {
      border-top: 1px solid #e5e5e5;
      padding-top: 9px;
      margin-top: 9px;
    }

    .small {
      font-size: 11px;
      color: #777;
    }

    #login {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #202124;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #loginbox {
      width: 350px;
      max-width: 90vw;
      background: #303134;
      color: white;
      padding: 22px;
      border-radius: 10px;
    }

    #password {
      position: relative;
      z-index: 10001;
      pointer-events: auto;
      display: block;
      width: 100%;
      height: 40px;
      background: #202124;
      color: white;
      border: 1px solid #666;
      border-radius: 5px;
      padding: 0 9px;
    }

    #loginbtn {
      width: 100%;
      height: 40px;
      margin-top: 8px;
      background: #1a73e8;
      color: white;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
    }

    #err {
      display: none;
      color: #ff8a80;
      font-size: 12px;
      margin-top: 8px;
    }

    #mapSearchBox {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: min(420px, calc(100% - 40px));
    }
    #mapSearch {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: rgba(255,255,255,.97);
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      outline: none;
    }
    #mapSearchResults {
      display: none;
      margin-top: 4px;
      max-height: 300px;
      overflow-y: auto;
      background: white;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    .mapSearchResult {
      padding: 9px 12px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }
    .mapSearchResult:hover { background: #f1f5f9; }
  </style>
</head>

<body>
  <div id="login">
    <div id="loginbox">
      <h2>POLRAD MAPPING</h2>
      <div style="color:#bbb;font-size:13px;margin-bottom:14px">Editor access</div>
      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        tabindex="1"
      >
      <button id="loginbtn">Enter</button>
      <div id="err">Incorrect password.</div>
    </div>
  </div>

  <div id="side">
    <div class="head">POLRAD map editor 2.0</div>

    <div class="tabs">
      <button class="tab active" id="tabTools" type="button">Editor tools</button>
      <button class="tab" id="tabAdvances" type="button">Advances</button>
    </div>

    <div class="body" id="paneTools">
      <div class="actions">
        <button class="btn" id="undo">↶ Undo</button>
        <button class="btn" id="redo">↷ Redo</button>
        <button class="btn" id="save">Save</button>
        <button class="btn" id="download">Download</button>
        <button class="btn" id="grayZoneToggle">Show Gray Zone</button>
        <button class="btn" id="grayZoneRecalc">Recalculate Gray Zone</button>
        <button class="btn primary" id="publish">Publish</button>
      </div>

      <input id="search" placeholder="Search polygons...">

      <div class="box">
        <b style="font-size:13px">Draw polygon</b>
        <label style="display:block;margin-top:7px">New polygon layer</label>
        <select id="drawLayer"></select>
        <button class="btn primary" id="draw">Draw a polygon</button>
      </div>

      <div class="box" id="selectedBox" style="display:none">
        <b id="selectedName" style="font-size:13px"></b>
        <label style="display:block;margin-top:7px">Layer</label>
        <select id="selectedLayer"></select>

        <label style="display:block;margin-top:9px">Simplify (fewer points)</label>
        <select id="simplifyLevel">
          <option value="0.0001">Very light</option>
          <option value="0.0003">Light</option>
          <option value="0.0006" selected>Medium</option>
          <option value="0.0012">Strong</option>
        </select>
        <button class="btn" id="simplifyBtn">Simplify shape</button>
        <div class="small" id="pointCount" style="margin-top:5px"></div>

        <button class="btn" id="delete" style="color:#b3261e">Delete polygon</button>
      </div>

      <div class="section">
        <b style="font-size:12px;color:#777">LAYERS</b>
        <span class="small" style="margin-left:6px">(tick = visible on map)</span>
      </div>

      <div id="layers"></div>
      <div class="small" id="status">Ready.</div>
    </div>

    <div class="body" id="paneAdvances" style="display:none">
      <b style="font-size:13px">Advance updates</b>
      <div class="small" style="margin-top:3px">
        Saved advance updates. New advances are created in the Editor tools tab.
      </div>
      <div id="advanceHistory"></div>
    </div>
  </div>

  <div id="map"></div>

  <div id="mapSearchBox">
    <input id="mapSearch" type="text" placeholder="🔍 Search towns, cities or coordinates..." autocomplete="off">
    <div id="mapSearchResults"></div>
  </div>



  <script src="https://unpkg.com/leaflet@1.9.2/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.0/dist/leaflet-geoman.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>

  <script>
    const WORKER = "https://polrad-editor-api.streetviewfun066.workers.dev/";

    const LAYERS = [
      ["ru_territory", "Russian-controlled territory", "Russian-controlled%20territory.geojson", "#a52714"],
      ["ua_territory", "Ukrainian-controlled territory", "Ukrainian-controlled%20territory.geojson", "#1a237e"],
      ["ua_advances", "Ukrainian advances", "Ukrainian%20advances.geojson", "#0288d1"],
      ["ru_advances", "Russian advances", "Russian%20advances.geojson", "#ffd600"],
      ["regained", "Territories regained in the last month", "Territories%20regained%20in%20the%20last%20month.geojson", "#0f9d58"],
      ["deepstate_frontline", "Claimed DeepState Frontline", "DeepState%20Frontline.geojson", "#000000", "line"],
      ["ria_frontline", "Claimed RIA Frontline", "RIA%20Frontline.geojson", "#000000", "line"]
    ];

    let map;
    let groups = {};
    let selected = null;
    let drawing = false;
    let polygonCounter = 1;
    let history = [];
    let historyIndex = -1;
    const layerOpenState = {};
    // Per-layer visibility on the map (true unless explicitly switched off).
    const layerVisible = {
      deepstate_frontline: false,
      ria_frontline: false
    };

    // Create a layer group; it is only added to the map if its layer is visible.
    function createGroup(id) {
      const group = L.featureGroup();
      if (layerVisible[id] !== false) group.addTo(map);
      return group;
    }
    let hoveredSidebarLayer = null;

    // Gray Zone is generated automatically from the current Russian-controlled
    // and Ukrainian-controlled/regained geometry. It is kept separate from
    // the editable polygon layers so it can be toggled on/off for checking.
    let grayZoneLayer = null;
    let grayZoneVisible = false;
    let grayZoneData = null;

    function getFeatureCollection(layerId) {
      const features = groups[layerId]
        ? groups[layerId].getLayers().map(function(layer) {
            const feature = layer.toGeoJSON();
            feature.properties = Object.assign(
              {},
              layer.feature && layer.feature.properties
                ? layer.feature.properties
                : {}
            );
            return feature;
          })
        : [];

      return {
        type: "FeatureCollection",
        features: features
      };
    }

    function safeFeatureCollection(fc) {
      if (!fc || !fc.features || !fc.features.length) return null;
      try {
        return turf.featureCollection(
          fc.features
            .map(function(feature) {
              try {
                return turf.cleanCoords(feature);
              } catch (e) {
                return feature;
              }
            })
            .filter(function(feature) {
              return feature && feature.geometry &&
                (feature.geometry.type === "Polygon" ||
                 feature.geometry.type === "MultiPolygon");
            })
        );
      } catch (e) {
        return null;
      }
    }

    function unionFeatures(fc) {
      if (!fc || !fc.features.length) return null;

      let result = null;

      fc.features.forEach(function(feature) {
        try {
          if (!result) {
            result = feature;
          } else {
            result = turf.union(turf.featureCollection([result, feature]));
          }
        } catch (e) {
          // Skip an invalid/problematic feature rather than breaking the editor.
        }
      });

      return result;
    }

    function unionAll(parts) {
      if (!parts.length) return null;

      let result = parts[0];

      for (let i = 1; i < parts.length; i++) {
        try {
          result = turf.union(turf.featureCollection([result, parts[i]]));
        } catch (e) {
          // Keep the previous result if a union fails on one part.
        }
      }

      return result;
    }

    function differenceFeatures(base, cutters) {
      if (!base) return null;

      let result = base;

      cutters.forEach(function(cutter) {
        if (!result || !cutter) return;

        try {
          result = turf.difference(
            turf.featureCollection([result, cutter])
          );
        } catch (e) {
          // Keep the previous result if a boolean operation fails.
        }
      });

      return result;
    }

    // Buffer with few arc steps, then simplify. Buffering a big polygon with
    // the default settings adds a rounded arc of many points at every corner,
    // which is what made the gray zone's curved edges consist of thousands of
    // points. The buffers only define the OUTER limit of the corridor, so a
    // small simplification tolerance (~300 m) is harmless here; the exact
    // territory edges are subtracted afterwards and are never simplified.
    function lightBuffer(feature, km) {
      const buffered = turf.buffer(feature, km, { units: "kilometers", steps: 4 });
      if (!buffered) return null;

      try {
        return turf.simplify(buffered, { tolerance: 0.003, highQuality: false });
      } catch (e) {
        return buffered;
      }
    }

    function generateGrayZone() {
      // The gray zone is the free space between the current Russian-controlled
      // and Ukrainian-controlled/regained polygons.
      //
      // We calculate it locally from the actual edited geometries. Because there
      // is no meaningful "gray zone" outside the mapped front area, the result
      // is restricted to a narrow corridor around the contact area.
      //
      // Both sides' "advances" layers are treated as claimed/contested ground
      // too, so they are folded into each side's controlled area. That keeps
      // the generated gray zone from overlapping the advance arrows/polygons.
      //
      // IMPORTANT: This is a derived/display layer only. It is never added to
      // LAYERS and therefore cannot overwrite your editable GeoJSON layers.

      grayZoneData = null;

      const ru = safeFeatureCollection(getFeatureCollection("ru_territory"));
      const uaTerritory = safeFeatureCollection(getFeatureCollection("ua_territory"));
      const regained = safeFeatureCollection(getFeatureCollection("regained"));
      const ruAdvances = safeFeatureCollection(getFeatureCollection("ru_advances"));
      const uaAdvances = safeFeatureCollection(getFeatureCollection("ua_advances"));

      if (!ru || !uaTerritory) {
        updateGrayZoneLayer();
        return null;
      }

      try {
        const ruParts = [];
        const ruBase = unionFeatures(ru);
        if (ruBase) ruParts.push(ruBase);
        if (ruAdvances && ruAdvances.features.length) {
          const a = unionFeatures(ruAdvances);
          if (a) ruParts.push(a);
        }

        const uaParts = [];
        if (uaTerritory && uaTerritory.features.length) {
          const u = unionFeatures(uaTerritory);
          if (u) uaParts.push(u);
        }
        if (regained && regained.features.length) {
          const r = unionFeatures(regained);
          if (r) uaParts.push(r);
        }
        if (uaAdvances && uaAdvances.features.length) {
          const a = unionFeatures(uaAdvances);
          if (a) uaParts.push(a);
        }

        if (!ruParts.length || !uaParts.length) {
          updateGrayZoneLayer();
          return null;
        }

        const ruUnion = unionAll(ruParts);
        const uaUnion = unionAll(uaParts);

        if (!ruUnion || !uaUnion) {
          updateGrayZoneLayer();
          return null;
        }

        // Build a corridor around both sides. The exact free space is then
        // obtained by subtracting the controlled areas (territory + advances)
        // from that corridor. 15 km gives enough room for normal front-line
        // gaps without creating a huge gray area across unrelated parts of
        // Ukraine.
        const ruBuffer = lightBuffer(ruUnion, 15);
        const uaBuffer = lightBuffer(uaUnion, 15);

        if (!ruBuffer || !uaBuffer) {
          updateGrayZoneLayer();
          return null;
        }

        // Keep only the overlap of the two 15 km influence zones. This means
        // the result exists only where the two sides are actually close.
        const corridor = turf.intersect(
          turf.featureCollection([ruBuffer, uaBuffer])
        );

        if (!corridor) {
          updateGrayZoneLayer();
          return null;
        }

        // Subtract BOTH sides' controlled area, which now includes their
        // advances, so the gray zone never overlaps an advance polygon.
        let gray = differenceFeatures(corridor, [ruUnion, uaUnion]);

        if (gray) {
          gray.properties = {
            Name: "Automatically generated Gray Zone"
          };
          grayZoneData = turf.featureCollection([gray]);
        }

      } catch (error) {
        console.warn("Gray Zone generation failed:", error);
        grayZoneData = null;
      }

      updateGrayZoneLayer();
      return grayZoneData;
    }

    function updateGrayZoneLayer() {
      if (grayZoneLayer) {
        map.removeLayer(grayZoneLayer);
        grayZoneLayer = null;
      }

      if (!grayZoneVisible || !grayZoneData || !map) return;

      grayZoneLayer = L.geoJSON(grayZoneData, {
        style: {
          color: "#666",
          fillColor: "#808080",
          fillOpacity: 0.35,
          weight: 1.5,
          interactive: false
        },
        interactive: false
      }).addTo(map);

      // Keep the gray zone underneath the editable territory polygons.
      grayZoneLayer.eachLayer(function(layer) {
        if (layer.bringToBack) layer.bringToBack();
      });
    }

    function toggleGrayZone() {
      grayZoneVisible = !grayZoneVisible;

      const button = $("grayZoneToggle");
      if (button) {
        button.textContent = grayZoneVisible
          ? "Hide Gray Zone"
          : "Show Gray Zone";
      }

      if (grayZoneVisible) {
        generateGrayZone();
        setStatus("Gray Zone shown for checking.");
      } else {
        updateGrayZoneLayer();
        setStatus("Gray Zone hidden.");
      }
    }

    // Manual recalculation, since the automatic recompute-on-every-edit-event
    // path can lag behind or misfire during multi-step edits (dragging several
    // vertices, moving polygons between layers, etc). Clicking this always
    // regenerates from whatever is on the map right now.
    function recalcGrayZone() {
      generateGrayZone();

      if (grayZoneVisible) {
        setStatus("Gray Zone recalculated.");
      } else {
        setStatus("Gray Zone recalculated (currently hidden — click \"Show Gray Zone\" to view).");
      }
    }

    // Prevent a Geoman vertex interaction from immediately triggering
    // the map's empty-space deselection handler.
    let ignoreNextMapClick = false;
    let ignoreMapClickTimer = null;

    function $(id) {
      return document.getElementById(id);
    }

    function config(id) {
      return LAYERS.find(layer => layer[0] === id);
    }

    function polygonName(layer) {
      return (
        layer.feature &&
        layer.feature.properties &&
        (layer.feature.properties.Name || layer.feature.properties.name)
      ) || "New polygon";
    }

    function setStatus(text) {
      $("status").textContent = text;
    }

    // Number of vertices in a layer's geometry.
    function countPoints(layer) {
      let n = 0;

      try {
        const geometry = layer.toGeoJSON().geometry;

        (function walk(c) {
          if (typeof c[0] === "number") {
            n++;
          } else {
            c.forEach(walk);
          }
        })(geometry.coordinates);
      } catch (e) {}

      return n;
    }

    function updatePointCount() {
      const node = $("pointCount");
      if (!node) return;

      node.textContent = selected
        ? countPoints(selected) + " points"
        : "";
    }

    function applyStyle(layer, isSelected = false) {
      const c = config(layer._layer);
      if (!c) return;

      const isLine = c[4] === "line";

      const fillOpacity = isLine ? 0 : 0.4;

      layer.setStyle({
        color: c[3],
        fillColor: c[3],
        fillOpacity: fillOpacity,
        weight: isSelected ? (isLine ? 5 : 4) : (isLine ? 3 : 2)
      });
    }

    function suppressNextMapClick() {
      ignoreNextMapClick = true;
      clearTimeout(ignoreMapClickTimer);

      ignoreMapClickTimer = setTimeout(() => {
        ignoreNextMapClick = false;
      }, 300);
    }

    // NOTE: the parameter used to be called "renderSidebar", which shadowed the
    // renderSidebar() function and made it crash ("renderSidebar is not a
    // function") whenever deselect() was called with the default value.
    function deselect(shouldRender = true) {
      if (selected) {
        selected.pm.disable();
        applyStyle(selected);
      }

      selected = null;
      $("selectedBox").style.display = "none";

      if (shouldRender) {
        renderSidebar();
      }
    }

    // Show/hide a whole layer on the map.
    function setLayerVisible(id, visible) {
      layerVisible[id] = visible;

      const group = groups[id];

      if (group && map) {
        if (visible) {
          if (!map.hasLayer(group)) map.addLayer(group);
        } else {
          // Can't keep editing a polygon that is being hidden.
          if (selected && selected._layer === id) {
            deselect(false);
          }

          if (map.hasLayer(group)) map.removeLayer(group);
        }
      }

      renderSidebar();
    }

    function select(layer) {
      if (!layer || drawing) return;

      // Selecting a polygon from the sidebar while its layer is hidden
      // switches that layer back on.
      if (layerVisible[layer._layer] === false) {
        setLayerVisible(layer._layer, true);
      }

      if (selected && selected !== layer) {
        selected.pm.disable();
        applyStyle(selected);
      }

      selected = layer;
      layer.pm.enable();
      applyStyle(layer, true);

      $("selectedBox").style.display = "block";
      $("selectedName").textContent = polygonName(layer);
      $("selectedLayer").value = layer._layer;
      updatePointCount();

      renderSidebar();
    }

    function setupPolygon(layer, layerId) {
      layer._layer = layerId;
      layer._fid = layer._fid || (
        "p-" + Date.now() + "-" + Math.random().toString(36).slice(2)
      );

      layer.feature = layer.feature || {
        type: "Feature",
        properties: {}
      };

      layer.feature.properties = layer.feature.properties || {};

      if (!layer.feature.properties.Name) {
        layer.feature.properties.Name = "New polygon " + polygonCounter++;
      }

      applyStyle(layer);

      layer.on("click", function(event) {
        L.DomEvent.stopPropagation(event);

        if (!drawing) {
          select(layer);
        }
      });

      // Keep the polygon selected while editing vertices.
      layer.on("pm:vertexadded", function() {
        if (layer === selected) {
          suppressNextMapClick();
          saveHistory();
          updatePointCount();
          if (grayZoneVisible) generateGrayZone();
          setStatus("Unsaved changes.");
        }
      });

      layer.on("pm:vertexremoved", function() {
        if (layer === selected) {
          suppressNextMapClick();
          saveHistory();
          updatePointCount();
          if (grayZoneVisible) generateGrayZone();
          setStatus("Unsaved changes.");
        }
      });

      layer.on("pm:markerdragstart", function() {
        if (layer === selected) {
          suppressNextMapClick();
        }
      });

      layer.on("pm:markerdragend", function() {
        if (layer === selected) {
          suppressNextMapClick();
          saveHistory();
          if (grayZoneVisible) generateGrayZone();
          setStatus("Unsaved changes.");
        }
      });

      layer.on("pm:edit", function() {
        if (!drawing && layer === selected) {
          suppressNextMapClick();
          saveHistory();
          renderSidebar();
          updatePointCount();
          if (grayZoneVisible) generateGrayZone();
          setStatus("Unsaved changes.");
        }
      });
    }

    function findPolygon(fid) {
      for (const c of LAYERS) {
        let found = null;

        if (!groups[c[0]]) continue;

        groups[c[0]].eachLayer(function(layer) {
          if (layer._fid === fid) {
            found = layer;
          }
        });

        if (found) return found;
      }

      return null;
    }

    function movePolygon(layer, targetId) {
      if (!layer || !groups[targetId]) return;

      const sourceId = layer._layer;

      if (sourceId === targetId) {
        select(layer);
        return;
      }

      // Don't let a polygon vanish into a hidden layer.
      if (layerVisible[targetId] === false) {
        layerVisible[targetId] = true;
        if (map && !map.hasLayer(groups[targetId])) {
          map.addLayer(groups[targetId]);
        }
      }

      const wasSelected = selected === layer;
      const sourceGroup = groups[sourceId];
      const targetGroup = groups[targetId];

      sourceGroup.removeLayer(layer);
      layer._layer = targetId;
      targetGroup.addLayer(layer);
      applyStyle(layer, wasSelected);

      if (wasSelected) {
        selected = layer;
        $("selectedLayer").value = targetId;
      }

      saveHistory();
      renderSidebar();
      setStatus("Polygon moved to " + config(targetId)[1] + ".");
    }

    function highlightSidebarPolygon(layer) {
      if (!layer) return;

      hoveredSidebarLayer = layer;
      try {
        layer.bringToFront();
        layer.setStyle({
          color: config(layer._layer)[3],
          fillColor: config(layer._layer)[3],
          fillOpacity: 0.6,
          weight: 5
        });
      } catch (e) {}
    }

    function unhighlightSidebarPolygon(layer) {
      if (!layer) return;
      if (hoveredSidebarLayer === layer) hoveredSidebarLayer = null;
      applyStyle(layer, layer === selected);
    }

    function renderSidebar() {
      const query = $("search").value.trim().toLowerCase();
      const output = $("layers");
      output.innerHTML = "";

      LAYERS.forEach(function(c) {
        const id = c[0];
        const group = groups[id];
        const layers = group ? group.getLayers() : [];
        const isVisible = layerVisible[id] !== false;

        const row = document.createElement("div");
        row.className = "layer";
        row.dataset.id = id;

        const header = document.createElement("div");
        header.className = "lh";

        const arrow = document.createElement("button");
        arrow.className = "arrow";
        arrow.textContent = "▸";

        // Visibility checkbox: show/hide the whole layer on the map.
        const visibility = document.createElement("input");
        visibility.type = "checkbox";
        visibility.className = "vis";
        visibility.checked = isVisible;
        visibility.title = "Show / hide this layer on the map";
        visibility.onclick = function(event) {
          event.stopPropagation();
        };
        visibility.onchange = function() {
          setLayerVisible(id, visibility.checked);
        };

        const swatch = document.createElement("span");
        swatch.className = "sw";
        swatch.style.background = c[3];

        const layerName = document.createElement("span");
        layerName.className = "lname" + (isVisible ? "" : " off");
        layerName.textContent = c[1];

        const count = document.createElement("span");
        count.className = "count";
        count.textContent = layers.length;

        header.append(arrow, visibility, swatch, layerName, count);
        row.appendChild(header);

        const list = document.createElement("div");
        list.className = "plist";
        list.hidden = layerOpenState[id] !== true;
        arrow.textContent = list.hidden ? "▸" : "▾";

        function toggleLayer() {
          list.hidden = !list.hidden;
          layerOpenState[id] = !list.hidden;
          arrow.textContent = list.hidden ? "▸" : "▾";
        }

        arrow.onclick = toggleLayer;
        layerName.onclick = toggleLayer;

        layers
          .filter(layer => {
            return !query || polygonName(layer).toLowerCase().includes(query);
          })
          .forEach(function(layer) {
            const item = document.createElement("div");
            item.className = "item" + (layer === selected ? " selected" : "");
            item.draggable = true;

            const grip = document.createElement("span");
            grip.className = "grip";
            grip.textContent = "⋮⋮";

            const text = document.createElement("span");
            text.textContent = polygonName(layer);

            item.append(grip, text);

            // Normal click selects the polygon.
            item.onclick = function() {
              select(layer);
            };

            // Highlight this exact polygon on the map while hovering its name.
            item.onmouseenter = function() {
              highlightSidebarPolygon(layer);
            };

            item.onmouseleave = function() {
              unhighlightSidebarPolygon(layer);
            };

            // Drag the sidebar item onto another layer header to move it.
            item.ondragstart = function(event) {
              if (drawing) {
                event.preventDefault();
                return;
              }

              event.dataTransfer.effectAllowed = "move";
              event.dataTransfer.setData("text/polygon", layer._fid);
              item.classList.add("dragging");
            };

            item.ondragend = function() {
              item.classList.remove("dragging");
              document
                .querySelectorAll(".layer.drop")
                .forEach(el => el.classList.remove("drop"));
            };

            list.appendChild(item);
          });

        row.appendChild(list);

        header.ondragover = function(event) {
          if (drawing) return;

          event.preventDefault();
          event.dataTransfer.dropEffect = "move";
          row.classList.add("drop");
        };

        header.ondragleave = function() {
          row.classList.remove("drop");
        };

        header.ondrop = function(event) {
          if (drawing) return;

          event.preventDefault();
          row.classList.remove("drop");

          const fid = event.dataTransfer.getData("text/polygon");
          const layer = findPolygon(fid);

          if (layer) {
            movePolygon(layer, id);
          }
        };

        output.appendChild(row);
      });
    }

    function fillLayerSelects() {
      ["drawLayer", "selectedLayer"].forEach(function(selectId) {
        const selectElement = $(selectId);
        selectElement.innerHTML = "";

        LAYERS.forEach(function(c) {
          // The Draw a polygon tool should only target polygon layers.
          // The line layers remain available in Selected Layer so their
          // existing frontline geometry can still be moved between layers.
          if (selectId === "drawLayer" && c[4] === "line") return;

          const option = document.createElement("option");
          option.value = c[0];
          option.textContent = c[1];
          selectElement.appendChild(option);
        });
      });
    }

    function addFeature(feature, layerId) {
      const layer = L.geoJSON(feature).getLayers()[0];
      if (!layer) return;

      // Keep the complete original properties object.
      layer.feature = feature;
      setupPolygon(layer, layerId);
      groups[layerId].addLayer(layer);
    }

    // Convert the ACTUAL current Leaflet polygons into valid GeoJSON, WITHOUT
    // touching the Gray Zone. This is what the undo/redo history stack uses:
    // restore() never reads the "Gray Zone" key, so there is no reason for
    // every single edit to pay for a fresh union/buffer/intersect/difference
    // pass.
    function getEditableGeoJSON() {
      const result = {};

      LAYERS.forEach(function(c) {
        const features = groups[c[0]]
          .getLayers()
          .map(function(layer) {
            const feature = layer.toGeoJSON();

            feature.properties = Object.assign(
              {},
              layer.feature && layer.feature.properties
                ? layer.feature.properties
                : {}
            );

            return feature;
          });

        result[c[1]] = {
          type: "FeatureCollection",
          features: features
        };
      });

      return result;
    }

    // Same as above, but also (re)computes the derived Gray Zone layer.
    // This is the expensive version: only call it where the Gray Zone
    // output is actually needed (Save / Download / Publish), not on every
    // edit event.
    function getCurrentGeoJSON() {
      const result = getEditableGeoJSON();

      // Gray Zone is derived from the current edited geometry.
      // It is included in the published package but is not part of the
      // editable LAYERS list.
      generateGrayZone();

      if (grayZoneData) {
        result["Gray Zone"] = grayZoneData;
      } else {
        result["Gray Zone"] = {
          type: "FeatureCollection",
          features: []
        };
      }

      return result;
    }

    function snapshot() {
      return JSON.parse(JSON.stringify(getEditableGeoJSON()));
    }

    function saveHistory() {
      const snap = snapshot();

      // Do not create a huge number of identical history states while
      // Geoman fires several edit-related events.
      const previous = history[history.length - 1];
      if (previous && JSON.stringify(previous) === JSON.stringify(snap)) {
        return;
      }

      history = history.slice(0, historyIndex + 1);
      history.push(snap);

      if (history.length > 40) {
        history.shift();
      }

      historyIndex = history.length - 1;
    }

    function undo() {
      if (historyIndex <= 0) return;
      historyIndex--;
      restore(history[historyIndex]);
      setStatus("Undid last change.");
    }

    function redo() {
      if (historyIndex >= history.length - 1) return;
      historyIndex++;
      restore(history[historyIndex]);
      setStatus("Redid change.");
    }

    function restore(state) {
      deselect(false);

      LAYERS.forEach(function(c) {
        groups[c[0]].clearLayers();
      });

      LAYERS.forEach(function(c) {
        const featureCollection = state[c[1]];

        if (!featureCollection || !featureCollection.features) return;

        featureCollection.features.forEach(function(feature) {
          addFeature(feature, c[0]);
        });
      });

      renderSidebar();
      generateGrayZone();
    }

    function startDrawing() {
      window.polradAdvanceDrawing = false;
      deselect(false);
      drawing = true;

      // Drawing into a hidden layer would make the new polygon invisible.
      const target = $("drawLayer").value;
      if (layerVisible[target] === false) {
        setLayerVisible(target, true);
      }

      Object.values(groups).forEach(function(group) {
        group.eachLayer(function(layer) {
          layer.pm.disable();
        });
      });

      map.pm.enableDraw("Polygon", {
        snappable: true,
        allowSelfIntersection: false
      });

      setStatus("Drawing polygon...");
    }

    // Set to true by the Advance editor while it is drawing an advance polygon,
    // so this general handler does not ALSO add the same polygon to the
    // "New polygon layer" chosen in the Draw polygon box.
    window.polradAdvanceDrawing = false;

    function polygonCreated(event) {
      if (window.polradAdvanceDrawing) return;

      const layer = event.layer;
      const targetId = $("drawLayer").value;

      map.pm.disableDraw();
      drawing = false;
      map.removeLayer(layer);

      const feature = layer.toGeoJSON();
      feature.properties = {
        Name: "New polygon " + polygonCounter++
      };

      layer.feature = feature;
      layer._layer = targetId;
      layer._fid = "new-" + Date.now() + "-" + Math.random();

      setupPolygon(layer, targetId);
      groups[targetId].addLayer(layer);

      saveHistory();
      select(layer);

      setStatus("New polygon added to " + config(targetId)[1] + ".");
    }

    // Reduce the number of points of the selected polygon / line.
    // Useful for shapes that have accumulated far too many vertices.
    function simplifySelected() {
      if (!selected) return;

      const tolerance = Number($("simplifyLevel").value);
      const before = countPoints(selected);

      try {
        const simplified = turf.simplify(selected.toGeoJSON(), {
          tolerance: tolerance,
          highQuality: true
        });

        const geometry = simplified.geometry;

        // Nesting depth of the coordinate array for Leaflet.
        let level = 0;
        if (geometry.type === "Polygon" || geometry.type === "MultiLineString") {
          level = 1;
        } else if (geometry.type === "MultiPolygon") {
          level = 2;
        }

        selected.pm.disable();
        selected.setLatLngs(
          L.GeoJSON.coordsToLatLngs(geometry.coordinates, level)
        );
        selected.redraw();
        selected.pm.enable();

        const after = countPoints(selected);

        saveHistory();
        updatePointCount();
        renderSidebar();
        if (grayZoneVisible) generateGrayZone();

        setStatus("Simplified: " + before + " → " + after + " points. Unsaved changes.");
      } catch (error) {
        console.warn("Simplify failed:", error);
        setStatus("Could not simplify this shape.");
      }
    }


    // Map search
    const searchInput = document.getElementById("mapSearch");
    const searchResults = document.getElementById("mapSearchResults");
    let searchMarker = null;

    function hideSearchResults() {
      searchResults.style.display = "none";
      searchResults.innerHTML = "";
    }

    async function performMapSearch() {
      const q = searchInput.value.trim();
      if (!q) { hideSearchResults(); return; }

      const coord = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);
      if (coord) {
        const lat = Number(coord[1]);
        const lng = Number(coord[2]);
        if (lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
          map.setView([lat, lng], 13);
          if (searchMarker) map.removeLayer(searchMarker);
          searchMarker = L.marker([lat, lng]).addTo(map).bindPopup(`${lat}, ${lng}`).openPopup();
          hideSearchResults();
          return;
        }
      }

      searchResults.innerHTML = '<div class="mapSearchResult">Searching...</div>';
      searchResults.style.display = "block";
      try {
        const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&accept-language=en&q=" + encodeURIComponent(q);
        const response = await fetch(url, { headers: { "Accept": "application/json" } });
        const places = await response.json();
        searchResults.innerHTML = "";
        if (!places.length) {
          searchResults.innerHTML = '<div class="mapSearchResult">No results found.</div>';
          return;
        }
        places.forEach(place => {
          const item = document.createElement("div");
          item.className = "mapSearchResult";
          item.textContent = place.display_name;
          item.addEventListener("click", () => {
            const lat = Number(place.lat);
            const lng = Number(place.lon);
            map.setView([lat, lng], 13);
            if (searchMarker) map.removeLayer(searchMarker);
            searchMarker = L.marker([lat, lng]).addTo(map).bindPopup(place.display_name).openPopup();
            hideSearchResults();
          });
          searchResults.appendChild(item);
        });
      } catch (e) {
        searchResults.innerHTML = '<div class="mapSearchResult">Search failed.</div>';
      }
    }

    searchInput.addEventListener("keydown", e => {
      if (e.key === "Enter") performMapSearch();
      if (e.key === "Escape") hideSearchResults();
    });
    document.addEventListener("click", e => {
      if (!document.getElementById("mapSearchBox").contains(e.target)) hideSearchResults();
    });

    async function load() {
      // If the user has clicked Save before, restore that edited map first.
      // Otherwise load the current GeoJSON files from the repository.
      let savedData = null;

      try {
        const saved = localStorage.getItem("polrad_editor_data");
        if (saved) {
          savedData = JSON.parse(saved);
        }
      } catch (error) {
        savedData = null;
      }

      if (savedData) {
        LAYERS.forEach(function(c) {
          groups[c[0]] = createGroup(c[0]);

          const featureCollection = savedData[c[1]];
          if (!featureCollection || !featureCollection.features) return;

          featureCollection.features.forEach(function(feature) {
            addFeature(feature, c[0]);
          });
        });

        saveHistory();
        renderSidebar();
        generateGrayZone();
        setStatus("Loaded your saved changes.");
        return;
      }

      for (const c of LAYERS) {
        groups[c[0]] = createGroup(c[0]);

        try {
          const response = await fetch("data/" + c[2]);
          const data = await response.json();

          (data.features || []).forEach(function(feature) {
            addFeature(feature, c[0]);
          });
        } catch (error) {
          setStatus("Could not load " + c[1]);
        }
      }

      saveHistory();
      renderSidebar();
      generateGrayZone();
    }

    async function login() {
      try {
        const response = await fetch(WORKER, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "login",
            password: $("password").value
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error("Incorrect password.");
        }

        $("login").style.display = "none";
        $("side").style.display = "block";

        map = L.map("map", {
          center: [48, 37.75],
          zoom: 7
        });

        const satellite = L.tileLayer(
          "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
          { attribution: "Tiles © Esri" }
        );

        // CARTO label-only layer over Esri satellite imagery.
        const cartoLabels = L.tileLayer(
          "https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png",
          {
            subdomains: "abcd",
            attribution: "© CARTO © OpenStreetMap contributors",
            pane: "overlayPane"
          }
        );

        const esriCartoHybrid = L.layerGroup([satellite, cartoLabels]);

        const osm = L.tileLayer(
          "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
          { attribution: "© OpenStreetMap contributors" }
        );

        const topo = L.tileLayer(
          "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
          { attribution: "© OpenTopoMap" }
        );

        // Esri satellite + CARTO labels is the default basemap.
        esriCartoHybrid.addTo(map);

        L.control.layers({
          "Esri + CARTO Labels": esriCartoHybrid,
          "Esri Satellite": satellite,
          "OpenStreetMap": osm,
          "OpenTopoMap": topo
        }).addTo(map);

        // Empty map click = deselect.
        // Editing vertex interactions are temporarily ignored above.
        map.on("click", function() {
          if (drawing || ignoreNextMapClick) return;
          deselect();
        });

        map.on("pm:create", polygonCreated);

        map.pm.addControls({
          position: "bottomleft",
          drawMarker: false,
          drawCircleMarker: false,
          drawPolyline: false,
          drawRectangle: false,
          drawCircle: false,
          drawText: false,
          editMode: false,
          dragMode: false,
          cutPolygon: false,
          removalMode: false,
          drawPolygon: false
        });

        fillLayerSelects();
        await load();
      } catch (error) {
        $("err").style.display = "block";
      }
    }

    window.addEventListener("load", function() {
      setTimeout(function() {
        $("password").focus();
      }, 50);
    });

    $("loginbtn").onclick = login;

    $("password").onkeydown = function(event) {
      if (event.key === "Enter") {
        login();
      }
    };

    $("draw").onclick = startDrawing;

    $("delete").onclick = function() {
      if (!selected) return;

      groups[selected._layer].removeLayer(selected);
      selected = null;
      $("selectedBox").style.display = "none";

      saveHistory();
      renderSidebar();
      setStatus("Feature deleted.");
    };

    $("selectedLayer").onchange = function(event) {
      if (selected) {
        movePolygon(selected, event.target.value);
      }
    };

    $("simplifyBtn").onclick = simplifySelected;

    function showEditorTab(name) {
      const tools = name === "tools";

      $("paneTools").style.display = tools ? "block" : "none";
      $("paneAdvances").style.display = tools ? "none" : "block";
      $("tabTools").classList.toggle("active", tools);
      $("tabAdvances").classList.toggle("active", !tools);
    }

    $("tabTools").onclick = function() { showEditorTab("tools"); };
    $("tabAdvances").onclick = function() { showEditorTab("advances"); };

    $("search").oninput = renderSidebar;

    $("undo").onclick = undo;
    $("redo").onclick = redo;
    $("grayZoneToggle").onclick = toggleGrayZone;
    $("grayZoneRecalc").onclick = recalcGrayZone;

    // SAVE = save the CURRENT edited geometry in this browser.
    $("save").onclick = function() {
      localStorage.setItem(
        "polrad_editor_data",
        JSON.stringify(getCurrentGeoJSON())
      );

      setStatus("Saved in this browser.");
      alert("Changes saved successfully.");
    };

    $("download").onclick = function() {
      const blob = new Blob(
        [JSON.stringify(getCurrentGeoJSON(), null, 2)],
        { type: "application/json" }
      );

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "polrad-edited-data.json";
      link.click();

      URL.revokeObjectURL(url);
    };

    // PUBLISH = send the CURRENT edited geometry as proper GeoJSON
    // FeatureCollections to the Cloudflare Worker.
    $("publish").onclick = async function() {
      setStatus("Publishing...");

      try {
        const currentFiles = getCurrentGeoJSON();

        const response = await fetch(WORKER, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "publish",
            files: currentFiles
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.error || "Publish failed");
        }

        // Keep the editor's local saved copy in sync with what was published.
        localStorage.setItem(
          "polrad_editor_data",
          JSON.stringify(currentFiles)
        );

        setStatus("Published successfully.");
        alert("Published successfully!");
      } catch (error) {
        setStatus(error.message);
      }
    };
  </script>

  const ADVANCE_TERRITORY = {
    ru_advances: ["ru_territory"],

  let advances = [];
  let advanceState = {

  function loadAdvances() {
    try {
      const raw = localStorage.getItem(ADVANCE_STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      advances = Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      advances = [];
    }
  }

  function saveAdvances() {
    localStorage.setItem(
      ADVANCE_STORAGE_KEY,
      JSON.stringify(advances)
    );
  }

  function getLayerFeatures(layerId) {
    if (!groups || !groups[layerId]) return [];

    return groups[layerId].getLayers().map(function(layer) {
      const feature = layer.toGeoJSON();
      feature.properties = Object.assign(
        {},
        layer.feature && layer.feature.properties
          ? layer.feature.properties
          : {}
      );
      return feature;
    });
  }

  /* ---------------------------------------------------------
     OVERLAP TRIMMING
     Removes from an advance polygon any part that lies inside
     the same side's already-controlled territory, so advances
     and territory never overlap.
     --------------------------------------------------------- */

  function territoryUnionFor(advanceLayerId) {
    const ids = ADVANCE_TERRITORY[advanceLayerId] || [];
    const parts = [];

    ids.forEach(function(id) {
      getLayerFeatures(id).forEach(function(feature) {
        if (
          feature &&
          feature.geometry &&
          (
            feature.geometry.type === "Polygon" ||
            feature.geometry.type === "MultiPolygon"
          )
        ) {
          try {
            parts.push(turf.cleanCoords(feature));
          } catch (e) {
            parts.push(feature);
          }
        }
      });
    });

    if (!parts.length) return null;

    return unionAll(parts);
  }

  // Returns "unchanged", "trimmed" or "removed".
  function trimAdvanceToTerritory(layer) {
    if (!layer || !layer._layer) return "unchanged";

    const territory = territoryUnionFor(layer._layer);
    if (!territory) return "unchanged";

    let feature;
    try {
      feature = turf.cleanCoords(layer.toGeoJSON());
    } catch (e) {
      feature = layer.toGeoJSON();
    }

    let result;
    try {
      result = turf.difference(
        turf.featureCollection([feature, territory])
      );
    } catch (e) {
      console.warn("Advance trim failed:", e);
      return "unchanged";
    }

    // Nothing left: the whole polygon was inside existing territory.
    if (!result) {
      const groupId = layer._layer;

      if (layer === selected) {
        deselect(false);
      }

      if (groups[groupId]) {
        groups[groupId].removeLayer(layer);
      }

      return "removed";
    }

    let beforeArea = 0;
    let afterArea = 0;

    try {
      beforeArea = turf.area(feature);
      afterArea = turf.area(result);
    } catch (e) {}

    // Less than 1 m² difference = no real overlap.
    if (Math.abs(beforeArea - afterArea) < 1) {
      return "unchanged";
    }

    const geometry = result.geometry;
    const level = geometry.type === "MultiPolygon" ? 2 : 1;
    const wasSelected = layer === selected;

    if (wasSelected) layer.pm.disable();

    layer.setLatLngs(
      L.GeoJSON.coordsToLatLngs(geometry.coordinates, level)
    );
    layer.redraw();

    if (wasSelected) {
      layer.pm.enable();
      updatePointCount();
    }

    return "trimmed";
  }

  // Trims every advance polygon created during the current advance.
  // Returns a short human-readable summary (or "").
  function trimCreatedAdvances() {
    let trimmed = 0;
    let removed = 0;
    const kept = [];

    advanceState.createdFids.forEach(function(fid) {
      const layer = findPolygon(fid);

      if (!layer) return;

      const result = trimAdvanceToTerritory(layer);

      if (result === "removed") {
        removed++;
      } else {
        if (result === "trimmed") trimmed++;
        kept.push(fid);
      }
    });

    advanceState.createdFids = kept;

    if (trimmed || removed) {
      saveHistory();
      renderSidebar();
    }

    const notes = [];
    if (trimmed) notes.push(trimmed + " polygon(s) trimmed to remove overlap with existing territory");
    if (removed) notes.push(removed + " polygon(s) discarded (entirely inside existing territory)");

    return notes.join("; ");
  }

  const ADVANCE_LAYER_IDS = ["ru_advances", "ua_advances"];

  // An advance polygon carries a "_advanceId" property. If a polygon with
  // that property sits in a NON-advance layer (e.g. Russian-controlled
  // territory), it is an accidental duplicate of an advance, created when
  // the normal draw handler and the advance handler both ran on the same
  // drawn shape. Remove those copies (also from saved advance snapshots).
  function removeStrayAdvanceCopies() {
    let removed = 0;
    let snapshotsCleaned = 0;

    LAYERS.forEach(function(c) {
      const id = c[0];

      if (ADVANCE_LAYER_IDS.indexOf(id) !== -1 || !groups[id]) return;

      groups[id].getLayers().slice().forEach(function(layer) {
        const props = layer.feature && layer.feature.properties;

        if (!props || !props._advanceId) return;

        if (layer === selected) deselect(false);

        groups[id].removeLayer(layer);

        // The very same polygon object may also belong to its real advance
        // layer; removing it from the wrong group took it off the map, so
        // put it back.
        const home = layer._layer;
        if (home !== id && groups[home] && groups[home].hasLayer(layer)) {
          groups[home].addLayer(layer);
        }

        removed++;
      });
    });

    advances.forEach(function(item) {
      if (!item.snapshotData) return;

      LAYERS.forEach(function(c) {
        if (ADVANCE_LAYER_IDS.indexOf(c[0]) !== -1) return;

        const fc = item.snapshotData[c[1]];
        if (!fc || !fc.features) return;

        const kept = fc.features.filter(function(f) {
          return !(f.properties && f.properties._advanceId);
        });

        if (kept.length !== fc.features.length) {
          fc.features = kept;
          snapshotsCleaned++;
        }
      });
    });

    if (snapshotsCleaned) saveAdvances();

    return { removed: removed, snapshotsCleaned: snapshotsCleaned };
  }

  // Manual tool: 1) remove accidental advance copies from other layers,
  // 2) trim ALL polygons in both advance layers against their side's
  // territory (useful to clean up advances drawn earlier).
  function trimAllAdvances() {
    if (!groups) return;

    const stray = removeStrayAdvanceCopies();

    let trimmed = 0;
    let removed = 0;

    ADVANCE_LAYER_IDS.forEach(function(id) {
      if (!groups[id]) return;

      groups[id].getLayers().slice().forEach(function(layer) {
        const result = trimAdvanceToTerritory(layer);
        if (result === "trimmed") trimmed++;
        if (result === "removed") removed++;
      });
    });

    if (stray.removed || trimmed || removed) {
      saveHistory();
      renderSidebar();
      updatePointCount();
      if (grayZoneVisible) generateGrayZone();

      setStatus(
        "Advance layers fixed: " +
        stray.removed +
        " stray copies removed, " +
        trimmed +
        " trimmed, " +
        removed +
        " discarded" +
        (stray.snapshotsCleaned
          ? ", " + stray.snapshotsCleaned + " saved snapshot layer(s) cleaned"
          : "") +
        ". Unsaved changes."
      );
    } else {
      setStatus("No advance problems found.");
    }
  }

  function unionAreaKm2(layerIds) {
    let features = [];

    layerIds.forEach(function(layerId) {
      getLayerFeatures(layerId).forEach(function(feature) {
        if (
          feature &&
          feature.geometry &&
          (
            feature.geometry.type === "Polygon" ||
            feature.geometry.type === "MultiPolygon"
          )
        ) {
          features.push(feature);
        }
      });
    });

    if (!features.length) return 0;

    let result = features[0];

    for (let i = 1; i < features.length; i++) {
      try {
        result = turf.union(
          turf.featureCollection([result, features[i]])
        );
      } catch (e) {
        // If a union fails, continue with the accumulated geometry.
      }
    }

    try {
      return turf.area(result) / 1000000;
    } catch (e) {
      return 0;
    }
  }

  function currentControlledAreas() {
    return {
      ru: unionAreaKm2([
        "ru_territory",
        "ru_advances"
      ]),
      ua: unionAreaKm2([
        "ua_territory",
        "regained",
        "ua_advances"
      ])
    };
  }

  function calculateEffects(before, after) {
    const ru = Number((after.ru - before.ru).toFixed(2));
    const ua = Number((after.ua - before.ua).toFixed(2));

    const effects = [];

    if (Math.abs(ru) >= 0.005) {
      effects.push({
        side: "ru",
        value: ru
      });
    }

    if (Math.abs(ua) >= 0.005) {
      effects.push({
        side: "ua",
        value: ua
      });
    }

    return effects;
  }

  function formatAreaEffects(effects, color) {
    if (!effects || !effects.length) {
      return '<span style="color:#777">No controlled-area change detected.</span>';
    }

    return effects.map(function(effect) {
      const value = Number(effect.value);
      const sign = value > 0 ? "+" : "";

      return (
        '<span class="advance-effect ' +
        (color === "blue" ? "blue" : "red") +
        '">' +
        sign +
        value.toFixed(2) +
        " km²" +
        "</span>"
      );
    }).join(" ");
  }

  function areaDisplay(effects) {
    return (effects || []).map(function(effect) {
      const value = Number(effect.value);
      const sign = value > 0 ? "+" : "";
      return sign + value.toFixed(2) + " km²";
    }).join(" ");
  }

  function currentFocus() {
    if (!map) return null;

    const center = map.getCenter();

    return {
      lat: center.lat,
      lng: center.lng,
      zoom: map.getZoom()
    };
  }

  function dateTimeNow() {
    const now = new Date();

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    return {
      date:
        now.getFullYear() +
        "-" +
        pad(now.getMonth() + 1) +
        "-" +
        pad(now.getDate()),

      time:
        pad(now.getHours()) +
        ":" +
        pad(now.getMinutes()) +
        ":" +
        pad(now.getSeconds())
    };
  }

  // Layer colors used while editing advances. Russian advances use #ffd600;
  // Ukrainian advances stay blue.
  function ensureAdvanceColors() {
    const ru = config("ru_advances");
    const ua = config("ua_advances");

    if (ru) ru[3] = "#ffd600";
    if (ua) ua[3] = "#1e88e5";

    if (groups && groups.ru_advances) {
      groups.ru_advances.eachLayer(function(layer) {
        applyStyle(layer, layer === selected);
      });
    }

    if (groups && groups.ua_advances) {
      groups.ua_advances.eachLayer(function(layer) {
        applyStyle(layer, layer === selected);
      });
    }

    // Refresh the sidebar swatches with the new colors.
    if (typeof renderSidebar === "function" && groups && groups.ru_advances) {
      renderSidebar();
    }
  }

  function setAdvanceStatus(text, active) {
    const node = A("advanceStatus");
    if (!node) return;

    node.textContent = text;
    node.className = active
      ? "active"
      : "";
  }

  function startAdvance() {
    if (advanceState.active) return;

    if (!map || !groups) {
      alert("The map has not finished loading yet.");
      return;
    }

    advanceState.active = true;
    advanceState.side = A("advanceSide").value;
    advanceState.type = "normal";
    advanceState.before = currentControlledAreas();
    advanceState.focus = currentFocus();
    advanceState.createdFids = [];
    advanceState.lastEffects = null;

    A("advanceStart").disabled = true;
    A("advanceFinish").disabled = false;
    A("advanceSide").disabled = true;

    setAdvanceStatus(
      "Advance mode active. Now draw the advance polygon below, or edit existing polygons as needed. When finished, click Finish Advance.",
      true
    );

    addDrawAdvanceButton();
  }

  function addDrawAdvanceButton() {
    if (A("drawAdvancePolygon")) return;

    const row = document.createElement("div");
    row.className = "advance-row";
    row.id = "advancePolygonRow";

    const sideName =
      advanceState.side === "ru"
        ? "Russian"
        : "Ukrainian";

      '<button class="btn" id="drawAdvancePolygon">' +

      " advance polygon" +

    );
