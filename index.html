<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POLRAD MAPPING — Editor</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<link
    rel="stylesheet"
    href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.0/dist/leaflet-geoman.css"
/>

<style>

/* =========================================================
   GENERAL
========================================================= */

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #111;
}

#map {
    width: 100%;
    height: 100%;
}


/* =========================================================
   LOGIN
========================================================= */

#loginScreen {
    position: fixed;
    inset: 0;
    z-index: 5000;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #111;
}

#loginBox {
    width: 320px;
    padding: 30px;

    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 10px;

    box-shadow: 0 10px 40px rgba(0,0,0,.5);

    text-align: center;
}

#loginBox h2 {
    margin-top: 0;
    margin-bottom: 20px;
    color: white;
}

#passwordInput {
    box-sizing: border-box;

    width: 100%;
    height: 42px;

    padding: 0 12px;

    background: #111;
    color: white;

    border: 1px solid #444;
    border-radius: 6px;

    outline: none;
}

#loginButton {
    width: 100%;
    height: 42px;

    margin-top: 12px;

    background: #3478db;
    color: white;

    border: none;
    border-radius: 6px;

    cursor: pointer;
    font-size: 15px;
}

#loginButton:hover {
    background: #2865bd;
}

#loginError {
    margin-top: 12px;
    color: #ff6b6b;
    font-size: 14px;
}


/* =========================================================
   TOOLBAR
========================================================= */

#toolbar {
    position: fixed;

    top: 10px;
    left: 10px;

    z-index: 3000;

    display: flex;
    gap: 5px;

    padding: 5px;

    background: rgba(23,23,23,.94);

    border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px;

    box-shadow: 0 2px 10px rgba(0,0,0,.35);
}

.toolButton {
    height: 34px;

    padding: 0 11px;

    background: #292929;
    color: white;

    border: none;
    border-radius: 6px;

    cursor: pointer;

    font-size: 14px;
}

.toolButton:hover {
    background: #3a3a3a;
}

.toolButton:disabled {
    opacity: .6;
    cursor: default;
}


/* =========================================================
   SEARCH
========================================================= */

#search-box {
    position: fixed;

    top: 12px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 3000;

    display: flex;

    width: min(420px, calc(100vw - 40px));

    background: rgba(23,23,23,.94);

    border: 1px solid rgba(255,255,255,.2);
    border-radius: 8px;

    padding: 5px;

    box-shadow: 0 2px 10px rgba(0,0,0,.35);
}

#search-input {
    flex: 1;

    min-width: 0;

    height: 34px;

    border: none;
    outline: none;

    background: transparent;
    color: white;

    padding: 0 9px;

    font-size: 14px;
}

#search-input::placeholder {
    color: #aaa;
}

#search-button {
    width: 38px;
    height: 34px;

    border: none;
    border-radius: 6px;

    background: #292929;
    color: white;

    cursor: pointer;

    font-size: 16px;
}

#search-button:hover {
    background: #383838;
}


/* =========================================================
   NEW POLYGON LAYER SELECTOR
========================================================= */

#polygonLayerSelector {
    position: fixed;

    top: 55px;
    left: 10px;

    z-index: 3000;

    display: none;

    align-items: center;
    gap: 8px;

    padding: 7px 9px;

    background: rgba(23,23,23,.96);

    border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px;

    color: white;

    box-shadow: 0 2px 10px rgba(0,0,0,.35);

    font-size: 13px;
}

#polygonLayerSelector label {
    white-space: nowrap;
}

#newPolygonLayer {
    height: 32px;

    padding: 0 8px;

    background: #292929;
    color: white;

    border: 1px solid #555;
    border-radius: 6px;

    outline: none;

    cursor: pointer;
}

#newPolygonLayer option {
    background: #222;
    color: white;
}


/* =========================================================
   LAYER PANEL
========================================================= */

#layerPanel {
    position: fixed;

    top: 105px;
    left: 10px;

    z-index: 3000;

    display: none;

    width: 260px;

    padding: 12px;

    background: rgba(23,23,23,.96);

    border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px;

    color: white;

    box-shadow: 0 2px 10px rgba(0,0,0,.35);
}

#layerPanel h3 {
    margin: 0 0 10px 0;
    font-size: 16px;
}

.layerRow {
    display: flex;
    align-items: center;

    margin-bottom: 8px;

    font-size: 13px;
}

.layerRow input {
    margin-right: 8px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    #toolbar {
        flex-wrap: wrap;
        max-width: calc(100vw - 20px);
    }

    .toolButton {
        padding: 0 8px;
        font-size: 12px;
    }

    #search-box {
        top: 65px;
    }

    #polygonLayerSelector {
        top: 120px;

        max-width: calc(100vw - 40px);

        flex-wrap: wrap;
    }

    #layerPanel {
        top: 185px;
    }

}

</style>
</head>

<body>


<!-- =======================================================
     LOGIN
======================================================= -->

<div id="loginScreen">

    <div id="loginBox">

        <h2>Log in (Polrad Ukraine Map)</h2>

        <input
            id="passwordInput"
            type="password"
            placeholder="Password"
        >

        <button id="loginButton">
            Log in
        </button>

        <div id="loginError"></div>

    </div>

</div>


<!-- =======================================================
     MAP
======================================================= -->

<div id="map"></div>


<!-- =======================================================
     SEARCH
======================================================= -->

<div id="search-box">

    <input
        id="search-input"
        type="text"
        placeholder="Search town, city or coordinates..."
        autocomplete="off"
    >

    <button id="search-button">
        🔍
    </button>

</div>


<!-- =======================================================
     TOOLBAR
======================================================= -->

<div id="toolbar" style="display:none;">

    <button class="toolButton" id="undoButton">
        ↶ Undo
    </button>

    <button class="toolButton" id="redoButton">
        ↷ Redo
    </button>

    <button class="toolButton" id="deleteButton">
        🗑 Delete
    </button>

    <button class="toolButton" id="layersButton">
        Layers
    </button>

    <button class="toolButton" id="saveButton">
        Save
    </button>

    <button class="toolButton" id="downloadButton">
        Download
    </button>

    <button class="toolButton" id="resetButton">
        Reset
    </button>

    <button class="toolButton" id="publishButton">
        Publish
    </button>

</div>


<!-- =======================================================
     NEW POLYGON LAYER SELECTOR
======================================================= -->

<div id="polygonLayerSelector">

    <label for="newPolygonLayer">
        New polygon layer:
    </label>

    <select id="newPolygonLayer">

        <option value="Ukrainian-controlled territory">
            🔵 Ukrainian-controlled territory
        </option>

        <option value="Russian-controlled territory">
            🔴 Russian-controlled territory
        </option>

        <option value="Ukrainian advances">
            🩵 Ukrainian advances
        </option>

        <option value="Russian advances">
            🟡 Russian advances
        </option>

        <option value="Territories regained in the last month">
            🟢 Territories regained in the last month
        </option>

    </select>

</div>


<!-- =======================================================
     LAYER PANEL
======================================================= -->

<div id="layerPanel">

    <h3>Layers</h3>

    <label class="layerRow">

        <input
            type="checkbox"
            id="layerRussianControlled"
            checked
        >

        Russian-controlled territory

    </label>


    <label class="layerRow">

        <input
            type="checkbox"
            id="layerUkrainianControlled"
            checked
        >

        Ukrainian-controlled territory

    </label>


    <label class="layerRow">

        <input
            type="checkbox"
            id="layerUkrainianAdvances"
            checked
        >

        Ukrainian advances

    </label>


    <label class="layerRow">

        <input
            type="checkbox"
            id="layerRussianAdvances"
            checked
        >

        Russian advances

    </label>


    <label class="layerRow">

        <input
            type="checkbox"
            id="layerRegained"
            checked
        >

        Territories regained in the last month

    </label>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.0/dist/leaflet-geoman.min.js"></script>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const WORKER_URL =
    "https://polrad-editor-api.streetviewfun066.workers.dev/";


const layerFiles = {

    "Russian-controlled territory":
        "data/Russian-controlled territory.geojson",

    "Ukrainian-controlled territory":
        "data/Ukrainian-controlled territory.geojson",

    "Ukrainian advances":
        "data/Ukrainian advances.geojson",

    "Russian advances":
        "data/Russian advances.geojson",

    "Territories regained in the last month":
        "data/Territories regained in the last month.geojson"

};


const layerColors = {

    "Russian-controlled territory":
        "#d94b4b",

    "Ukrainian-controlled territory":
        "#4b83d9",

    "Ukrainian advances":
        "#6fb7ff",

    "Russian advances":
        "#f1c40f",

    "Territories regained in the last month":
        "#42b883"

};


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let map;

let loadedLayers = {};

let selectedLayer = null;

let undoStack = [];

let redoStack = [];


/* =========================================================
   LOGIN
========================================================= */

const loginScreen =
    document.getElementById("loginScreen");

const passwordInput =
    document.getElementById("passwordInput");

const loginButton =
    document.getElementById("loginButton");

const loginError =
    document.getElementById("loginError");


loginButton.addEventListener(
    "click",
    login
);


passwordInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            login();

        }

    }
);


async function login() {

    const password =
        passwordInput.value;

    loginError.textContent = "";

    loginButton.disabled = true;

    loginButton.textContent =
        "Logging in...";


    try {

        const response =
            await fetch(
                WORKER_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            action: "login",

                            password: password

                        })

                }
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            loginError.textContent =
                "Incorrect password.";

            return;

        }


        loginScreen.style.display =
            "none";


        document.getElementById(
            "toolbar"
        ).style.display =
            "flex";


        document.getElementById(
            "polygonLayerSelector"
        ).style.display =
            "flex";


        initializeMap();


    } catch (error) {

        console.error(error);

        loginError.textContent =
            "Login failed. Check the connection.";

    } finally {

        loginButton.disabled = false;

        loginButton.textContent =
            "Log in";

    }

}


/* =========================================================
   INITIALIZE MAP
========================================================= */

async function initializeMap() {

    map = L.map(
        "map",
        {

            zoomControl: true,

            center: [
                48.5,
                37.0
            ],

            zoom: 7

        }
    );


    /* =====================================================
       HYBRID BASEMAP
    ===================================================== */

    const hybridImagery =
        L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {

                maxZoom: 19,

                attribution:
                    "Tiles © Esri"

            }
        );


    const hybridLabels =
        L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
            {

                maxZoom: 19,

                attribution:
                    "Labels © Esri"

            }
        );


    const hybrid =
        L.layerGroup([
            hybridImagery,
            hybridLabels
        ]);


    /* =====================================================
       OPENSTREETMAP
    ===================================================== */

    const openStreetMap =
        L.tileLayer(
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            {

                maxZoom: 19,

                attribution:
                    '© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'

            }
        );


    /* =====================================================
       OPENTOPOMAP
    ===================================================== */

    const openTopoMap =
        L.tileLayer(
            "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
            {

                maxZoom: 17,

                attribution:
                    'Kartendaten: © OpenStreetMap-Mitwirkende, SRTM | Kartendarstellung: © <a href="https://opentopomap.org" target="_blank">OpenTopoMap</a>'

            }
        );


    /* =====================================================
       HYBRID DEFAULT
    ===================================================== */

    hybrid.addTo(map);


    /* =====================================================
       BASEMAP SELECTOR
    ===================================================== */

    const baseMaps = {

        "🛰️ Hybrid":
            hybrid,

        "🗺️ OpenStreetMap":
            openStreetMap,

        "🏔️ OpenTopoMap":
            openTopoMap

    };


    L.control.layers(
        baseMaps,
        null,
        {
            position: "topright",
            collapsed: true
        }
    ).addTo(map);


    /* =====================================================
       GEOMAN
    ===================================================== */

    map.pm.addControls({

        position: "topleft",

        drawMarker: false,

        drawCircleMarker: false,

        drawPolyline: false,

        drawRectangle: false,

        drawCircle: false,

        drawText: false,

        editMode: false,

        dragMode: false,

        cutPolygon: false,

        removalMode: false

    });


    /* =====================================================
       LOAD GEOJSON
    ===================================================== */

    await loadAllLayers();


    /* =====================================================
       INITIAL HISTORY
    ===================================================== */

    saveHistory();


    /* =====================================================
       POLYGON CREATED
    ===================================================== */

    map.on(
        "pm:create",
        function(event) {

            handleNewPolygon(
                event.layer
            );

        }
    );


    /* =====================================================
       POLYGON REMOVED
    ===================================================== */

    map.on(
        "pm:remove",
        function() {

            saveHistory();

        }
    );

}


/* =========================================================
   LOAD ALL GEOJSON
========================================================= */

async function loadAllLayers() {

    for (
        const [name, path]
        of Object.entries(layerFiles)
    ) {

        try {

            const response =
                await fetch(path);


            const data =
                await response.json();


            const layer =
                L.geoJSON(
                    data,
                    {

                        style: {

                            color:
                                layerColors[name],

                            fillColor:
                                layerColors[name],

                            weight: 2,

                            fillOpacity: 0.45

                        },


                        onEachFeature:
                            function(
                                feature,
                                featureLayer
                            ) {

                                setupPolygon(
                                    featureLayer,
                                    name
                                );

                            }

                    }
                );


            layer.addTo(map);


            loadedLayers[name] =
                layer;


        } catch (error) {

            console.error(
                "Could not load:",
                name,
                error
            );

        }

    }

}


/* =========================================================
   SETUP EXISTING POLYGON
========================================================= */

function setupPolygon(
    featureLayer,
    layerName
) {

    featureLayer.on(
        "click",
        function() {

            selectPolygon(
                featureLayer
            );

        }
    );


    featureLayer.on(
        "pm:edit",
        function() {

            saveHistory();

        }
    );

}


/* =========================================================
   SELECT POLYGON
========================================================= */

function selectPolygon(layer) {

    if (
        selectedLayer &&
        selectedLayer !== layer
    ) {

        try {

            selectedLayer.pm.disable();

            selectedLayer.setStyle({

                weight: 2

            });

        } catch (error) {}

    }


    selectedLayer =
        layer;


    selectedLayer.setStyle({

        weight: 4

    });


    try {

        selectedLayer.pm.enable();

    } catch (error) {

        console.error(error);

    }

}


/* =========================================================
   NEW POLYGON
========================================================= */

function handleNewPolygon(
    polygon
) {

    const selectedLayerName =
        document.getElementById(
            "newPolygonLayer"
        ).value;


    const targetLayer =
        loadedLayers[
            selectedLayerName
        ];


    if (!targetLayer) {

        console.error(
            "Target layer not found:",
            selectedLayerName
        );

        map.removeLayer(
            polygon
        );

        return;

    }


    /*
       Geoman initially places the polygon
       directly on the map.

       Remove it from the map first.
    */

    map.removeLayer(
        polygon
    );


    /*
       Give the polygon basic GeoJSON
       properties.
    */

    polygon.feature = {

        type: "Feature",

        properties: {

            Name: "New polygon"

        },

        geometry: polygon.toGeoJSON().geometry

    };


    /*
       Apply the target layer's style.
    */

    polygon.setStyle({

        color:
            layerColors[
                selectedLayerName
            ],

        fillColor:
            layerColors[
                selectedLayerName
            ],

        weight: 2,

        fillOpacity: 0.45

    });


    /*
       Add it to the selected GeoJSON layer.
    */

    targetLayer.addLayer(
        polygon
    );


    /*
       Make it the selected polygon.
    */

    selectPolygon(
        polygon
    );


    /*
       Save the change to history.
    */

    saveHistory();

}


/* =========================================================
   GET CURRENT DATA
========================================================= */

function getCurrentData() {

    const data = {};


    for (
        const [name, layer]
        of Object.entries(
            loadedLayers
        )
    ) {

        data[name] =
            layer.toGeoJSON();

    }


    return data;

}


/* =========================================================
   HISTORY
========================================================= */

function saveHistory() {

    const snapshot =
        JSON.stringify(
            getCurrentData()
        );


    undoStack.push(
        snapshot
    );


    if (
        undoStack.length > 50
    ) {

        undoStack.shift();

    }


    redoStack = [];

}


/* =========================================================
   RESTORE HISTORY SNAPSHOT
========================================================= */

function restoreSnapshot(
    snapshot
) {

    const data =
        JSON.parse(
            snapshot
        );


    for (
        const [name, layer]
        of Object.entries(
            loadedLayers
        )
    ) {

        map.removeLayer(
            layer
        );

    }


    loadedLayers = {};

    selectedLayer = null;


    for (
        const [name, geojson]
        of Object.entries(data)
    ) {

        const layer =
            L.geoJSON(
                geojson,
                {

                    style: {

                        color:
                            layerColors[name],

                        fillColor:
                            layerColors[name],

                        weight: 2,

                        fillOpacity: 0.45

                    },

                    onEachFeature:
                        function(
                            feature,
                            featureLayer
                        ) {

                            setupPolygon(
                                featureLayer,
                                name
                            );

                        }

                }
            );


        layer.addTo(map);


        loadedLayers[name] =
            layer;

    }

}


/* =========================================================
   UNDO
========================================================= */

document.getElementById(
    "undoButton"
).addEventListener(
    "click",
    function() {

        if (
            undoStack.length <= 1
        ) {

            return;

        }


        const current =
            undoStack.pop();


        redoStack.push(
            current
        );


        const previous =
            undoStack[
                undoStack.length - 1
            ];


        restoreSnapshot(
            previous
        );

    }
);


/* =========================================================
   REDO
========================================================= */

document.getElementById(
    "redoButton"
).addEventListener(
    "click",
    function() {

        if (
            !redoStack.length
        ) {

            return;

        }


        const next =
            redoStack.pop();


        undoStack.push(
            next
        );


        restoreSnapshot(
            next
        );

    }
);


/* =========================================================
   DELETE POLYGON
========================================================= */

document.getElementById(
    "deleteButton"
).addEventListener(
    "click",
    function() {

        if (!selectedLayer) {

            alert(
                "Select a polygon first."
            );

            return;

        }


        for (
            const layer
            of Object.values(
                loadedLayers
            )
        ) {

            if (
                layer.hasLayer(
                    selectedLayer
                )
            ) {

                layer.removeLayer(
                    selectedLayer
                );

                break;

            }

        }


        selectedLayer = null;


        saveHistory();

    }
);


/* =========================================================
   LAYERS BUTTON
========================================================= */

document.getElementById(
    "layersButton"
).addEventListener(
    "click",
    function() {

        const panel =
            document.getElementById(
                "layerPanel"
            );


        if (
            panel.style.display ===
            "block"
        ) {

            panel.style.display =
                "none";

        } else {

            panel.style.display =
                "block";

        }

    }
);


/* =========================================================
   LAYER VISIBILITY
========================================================= */

const layerCheckboxes = {

    layerRussianControlled:
        "Russian-controlled territory",

    layerUkrainianControlled:
        "Ukrainian-controlled territory",

    layerUkrainianAdvances:
        "Ukrainian advances",

    layerRussianAdvances:
        "Russian advances",

    layerRegained:
        "Territories regained in the last month"

};


for (
    const [checkboxId, layerName]
    of Object.entries(
        layerCheckboxes
    )
) {

    document.getElementById(
        checkboxId
    ).addEventListener(
        "change",
        function() {

            const layer =
                loadedLayers[
                    layerName
                ];


            if (!layer)
                return;


            if (this.checked) {

                layer.addTo(
                    map
                );

            } else {

                map.removeLayer(
                    layer
                );

            }

        }
    );

}


/* =========================================================
   SAVE
========================================================= */

document.getElementById(
    "saveButton"
).addEventListener(
    "click",
    function() {

        const savedData = {};


        for (
            const [name, layer]
            of Object.entries(
                loadedLayers
            )
        ) {

            savedData[name] =
                layer.toGeoJSON();

        }


        localStorage.setItem(
            "polrad_editor_data",
            JSON.stringify(
                savedData
            )
        );


        alert(
            "Editor data saved locally."
        );

    }
);


/* =========================================================
   DOWNLOAD
========================================================= */

document.getElementById(
    "downloadButton"
).addEventListener(
    "click",
    function() {

        const data =
            getCurrentData();


        const blob =
            new Blob(
                [
                    JSON.stringify(
                        data,
                        null,
                        2
                    )
                ],
                {
                    type:
                        "application/json"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            "polrad-edited-data.json";


        link.click();


        URL.revokeObjectURL(
            url
        );

    }
);


/* =========================================================
   RESET
========================================================= */

document.getElementById(
    "resetButton"
).addEventListener(
    "click",
    function() {

        if (
            !confirm(
                "Reset all changes and reload the original map data?"
            )
        ) {

            return;

        }


        location.reload();

    }
);


/* =========================================================
   PUBLISH
========================================================= */

document.getElementById(
    "publishButton"
).addEventListener(
    "click",
    async function() {

        if (
            !confirm(
                "Publish these changes to the public map?"
            )
        ) {

            return;

        }


        const button =
            document.getElementById(
                "publishButton"
            );


        button.disabled = true;

        button.textContent =
            "Publishing...";


        try {

            const files =
                getCurrentData();


            const response =
                await fetch(
                    WORKER_URL,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                action:
                                    "publish",

                                files:
                                    files

                            })

                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.error ||
                    "Publishing failed."
                );

            }


            alert(
                "Published successfully!"
            );


        } catch (error) {

            console.error(
                error
            );


            alert(
                "Publish failed: " +
                error.message
            );


        } finally {

            button.disabled = false;

            button.textContent =
                "Publish";

        }

    }
);


/* =========================================================
   SEARCH
========================================================= */

const searchInput =
    document.getElementById(
        "search-input"
    );


const searchButton =
    document.getElementById(
        "search-button"
    );


async function searchLocation() {

    const query =
        searchInput.value.trim();


    if (!query)
        return;


    /* =====================================================
       COORDINATES
    ===================================================== */

    const coordinateMatch =
        query.match(
            /^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/
        );


    if (coordinateMatch) {

        const lat =
            parseFloat(
                coordinateMatch[1]
            );


        const lng =
            parseFloat(
                coordinateMatch[2]
            );


        if (
            lat >= -90 &&
            lat <= 90 &&
            lng >= -180 &&
            lng <= 180
        ) {

            map.setView(
                [lat, lng],
                13
            );


            return;

        }

    }


    /* =====================================================
       TOWN / CITY SEARCH
    ===================================================== */

    try {

        searchButton.textContent =
            "…";


        const response =
            await fetch(
                "https://nominatim.openstreetmap.org/search?" +
                new URLSearchParams({

                    q: query,

                    format: "json",

                    limit: "1"

                })
            );


        const results =
            await response.json();


        if (!results.length) {

            alert(
                "Location not found."
            );

            return;

        }


        const result =
            results[0];


        const lat =
            parseFloat(
                result.lat
            );


        const lng =
            parseFloat(
                result.lon
            );


        map.setView(
            [lat, lng],
            13
        );


    } catch (error) {

        console.error(
            "Search error:",
            error
        );


        alert(
            "Search failed."
        );


    } finally {

        searchButton.textContent =
            "🔍";

    }

}


searchButton.addEventListener(
    "click",
    searchLocation
);


searchInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            searchLocation();

        }

    }
);

</script>

</html>
