<script>
(function () {
  "use strict";

  function polys(layerId) {
    return getFeatureCollection(layerId).features
      .filter(function (f) {
        return f && f.geometry &&
          (f.geometry.type === "Polygon" || f.geometry.type === "MultiPolygon");
      })
      .map(function (f) {
        try { return turf.cleanCoords(f); } catch (e) { return f; }
      });
  }

  function uniteAll(list) {
    var result = null;
    list.forEach(function (f) {
      try { result = result ? turf.union(result, f) : f; }
      catch (e) { console.warn("Gray Zone union failed:", e); }
    });
    return result;
  }

  // Gray zone = area within 15 km of BOTH sides, minus the territory of both sides.
  // Russian side: Russian-controlled territory + Russian advances
  // Ukrainian side: Ukrainian-controlled territory + Ukrainian advances + Territories regained
  window.generateGrayZone = function () {
    grayZoneData = null;

    var ru = uniteAll(polys("ru_territory").concat(polys("ru_advances")));
    var ua = uniteAll(
      polys("ua_territory").concat(polys("ua_advances"), polys("regained"))
    );

    if (!ru || !ua) {
      updateGrayZoneLayer();
      return null;
    }

    try {
      var ruBuf = turf.buffer(ru, 15, { units: "kilometers", steps: 8 });
      var uaBuf = turf.buffer(ua, 15, { units: "kilometers", steps: 8 });
      var piece = turf.intersect(ruBuf, uaBuf);

      if (piece) piece = turf.difference(piece, ru);
      if (piece) piece = turf.difference(piece, ua);

      if (piece) {
        grayZoneData = piece.type === "FeatureCollection"
          ? piece
          : turf.featureCollection([piece]);
      }
    } catch (error) {
      console.warn("Gray Zone generation failed:", error);
    }

    updateGrayZoneLayer();
    return grayZoneData;
  };
})();
</script>
