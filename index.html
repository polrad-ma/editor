<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POLRAD MAPPING — Editor</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.2/dist/leaflet.css"><link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.0/dist/leaflet-geoman.css"><style>*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}#map{position:absolute;left:340px;width:calc(100% - 340px)}#side{display:none;position:absolute;z-index:2000;left:0;top:0;bottom:0;width:340px;background:#fff;border-right:1px solid #ddd;overflow:auto}.head{height:62px;padding:12px 15px;border-bottom:1px solid #ddd;font-weight:600;font-size:16px}.body{padding:12px}.actions{display:flex;gap:5px;margin-bottom:9px}.btn{border:1px solid #ccc;background:#fff;border-radius:6px;padding:7px 9px;cursor:pointer}.primary{background:#1a73e8;color:#fff;border-color:#1a73e8}#search{width:100%;height:36px;border:1px solid #ccc;border-radius:6px;padding:0 9px;margin-bottom:9px}.box{background:#f7f8f9;border:1px solid #ddd;border-radius:7px;padding:9px;margin-bottom:10px}.box label{font-size:11px;color:#777}.box select{width:100%;height:34px;margin-top:4px;border:1px solid #ccc;border-radius:5px;background:#fff}.box button{width:100%;margin-top:7px}.layer{border:1px solid transparent;border-radius:7px;padding:5px;margin:2px 0}.layer.drop{background:#e8f0fe;border-color:#1a73e8}.lh{display:flex;align-items:center;gap:6px;min-height:28px}.arrow{border:0;background:none;cursor:pointer;width:20px}.sw{width:14px;height:14px;border-radius:3px;border:1px solid #aaa}.lname{flex:1;font-size:13px;cursor:pointer}.count{font-size:11px;color:#888}.plist{margin-left:27px}.item{display:flex;gap:6px;padding:6px;border-radius:5px;font-size:12px;cursor:grab;border:1px solid transparent;user-select:none}.item:hover{background:#f1f3f4}.item.selected{background:#e8f0fe;border-color:#c5d7f7;color:#174ea6}.item.dragging{opacity:.4}.grip{color:#999}.section{border-top:1px solid #e5e5e5;padding-top:9px;margin-top:9px}.small{font-size:11px;color:#777}#login{position:fixed;inset:0;z-index:9999;background:#202124;display:flex;align-items:center;justify-content:center}#loginbox{width:350px;max-width:90vw;background:#303134;color:white;padding:22px;border-radius:10px}#password{width:100%;height:40px;background:#202124;color:white;border:1px solid #666;border-radius:5px;padding:0 9px}#loginbtn{width:100%;height:40px;margin-top:8px;background:#1a73e8;color:white;border:0;border-radius:5px;cursor:pointer}#err{display:none;color:#ff8a80;font-size:12px;margin-top:8px}</style></head><body>
<div id="login"><div id="loginbox"><h2>POLRAD MAPPING</h2><div style="color:#bbb;font-size:13px;margin-bottom:14px">Editor access</div><input id="password" type="password" placeholder="Password"><button id="loginbtn">Enter</button><div id="err">Incorrect password.</div></div></div>
<div id="side"><div class="head">POLRAD MAPPING — Editor</div><div class="body"><div class="actions"><button class="btn" id="save">Save</button><button class="btn" id="download">Download</button><button class="btn" id="reset">Reset</button><button class="btn primary" id="publish">Publish</button></div><input id="search" placeholder="Search polygons..."><div class="box"><b style="font-size:13px">Draw polygon</b><label style="display:block;margin-top:7px">New polygon layer</label><select id="drawLayer"></select><button class="btn primary" id="draw">Draw a polygon</button></div><div class="box" id="selectedBox" style="display:none"><b id="selectedName" style="font-size:13px"></b><label style="display:block;margin-top:7px">Layer</label><select id="selectedLayer"></select><button class="btn" id="delete" style="color:#b3261e">Delete polygon</button></div><div class="section"><b style="font-size:12px;color:#777">LAYERS</b></div><div id="layers"></div><div class="small" id="status">Ready.</div></div></div><div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.2/dist/leaflet.js"></script><script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.0/dist/leaflet-geoman.min.js"></script><script>
const WORKER='https://polrad-editor-api.streetviewfun066.workers.dev/';const C=[['ru_territory','Russian-controlled territory','Russian-controlled%20territory.geojson','#d94b4b'],['ua_territory','Ukrainian-controlled territory','Ukrainian-controlled%20territory.geojson','#4b83d9'],['ua_advances','Ukrainian advances','Ukrainian%20advances.geojson','#6fb7ff'],['ru_advances','Russian advances','Russian%20advances.geojson','#f1c40f'],['regained','Territories regained in the last month','Territories%20regained%20in%20the%20last%20month.geojson','#42b883']];let map,groups={},selected=null,drawing=false,n=1,history=[],hi=-1;
const $=x=>document.getElementById(x),cfg=id=>C.find(c=>c[0]===id),name=l=>(l.feature&&l.feature.properties&&(l.feature.properties.Name||l.feature.properties.name))||'New polygon';
function status(s){$('status').textContent=s}function style(l,sel=false){let c=cfg(l._layer);l.setStyle({color:c[3],fillColor:c[3],fillOpacity:.4,weight:sel?4:2})}function deselect(){if(selected){selected.pm.disable();style(selected)}selected=null;$('selectedBox').style.display='none';render()}
function select(l){if(selected&&selected!==l){selected.pm.disable();style(selected)}selected=l;drawing=false;l.pm.enable();style(l,true);$('selectedBox').style.display='block';$('selectedName').textContent=name(l);$('selectedLayer').value=l._layer;render()}
function setup(l,id){l._layer=id;l._fid=l._fid||('p-'+Date.now()+'-'+Math.random());l.feature=l.feature||{type:'Feature',properties:{}};l.feature.properties=l.feature.properties||{};if(!l.feature.properties.Name)l.feature.properties.Name='New polygon '+n++;style(l);l.on('click',e=>{L.DomEvent.stopPropagation(e);if(!drawing)select(l)});l.on('pm:edit',()=>status('Unsaved changes.'))}
function find(fid){for(let c of C){let x=null;groups[c[0]].eachLayer(l=>{if(l._fid===fid)x=l});if(x)return x}}
function move(l,to){let from=l._layer;if(from===to)return select(l);let g=groups[from],ng=groups[to];let f=l.toGeoJSON();f.properties=Object.assign({},l.feature.properties);g.removeLayer(l);l.feature=f;l._layer=to;style(l,selected===l);ng.addLayer(l);select(l);status('Polygon moved to '+cfg(to)[1]+'.');render()}
function render(){let q=$('search').value.toLowerCase(),out=$('layers');out.innerHTML='';C.forEach(c=>{let id=c[0],g=groups[id],arr=g.getLayers();let row=document.createElement('div');row.className='layer';row.dataset.id=id;let h=document.createElement('div');h.className='lh';let a=document.createElement('button');a.className='arrow';a.textContent='▾';let sw=document.createElement('span');sw.className='sw';sw.style.background=c[3];let nm=document.createElement('span');nm.className='lname';nm.textContent=c[1];let ct=document.createElement('span');ct.className='count';ct.textContent=arr.length;h.append(a,sw,nm,ct);row.appendChild(h);let list=document.createElement('div');list.className='plist';a.onclick=()=>{list.hidden=!list.hidden;a.textContent=list.hidden?'▸':'▾'};arr.filter(l=>!q||name(l).toLowerCase().includes(q)).forEach(l=>{let it=document.createElement('div');it.className='item'+(l===selected?' selected':'');it.draggable=true;it.innerHTML='<span class="grip">⋮⋮</span><span>'+name(l)+'</span>';it.onclick=()=>select(l);it.ondragstart=e=>{e.dataTransfer.setData('text/polygon',l._fid);it.classList.add('dragging')};it.ondragend=()=>it.classList.remove('dragging');list.appendChild(it)});row.appendChild(list);h.ondragover=e=>{e.preventDefault();row.classList.add('drop')};h.ondragleave=()=>row.classList.remove('drop');h.ondrop=e=>{e.preventDefault();row.classList.remove('drop');let l=find(e.dataTransfer.getData('text/polygon'));if(l)move(l,id)};out.appendChild(row)})}
function selects(){C.forEach(c=>{for(let id of ['drawLayer','selectedLayer']){let o=document.createElement('option');o.value=c[0];o.textContent=c[1];$(id).appendChild(o)}})}
function add(feature,id){let l=L.geoJSON(feature).getLayers()[0];if(!l)return;setup(l,id);groups[id].addLayer(l)}
function snapshot(){let s={};C.forEach(c=>s[c[0]]={type:'FeatureCollection',features:groups[c[0]].getLayers().map(l=>{let f=l.toGeoJSON();f.properties=Object.assign({},l.feature.properties);return f})});return JSON.parse(JSON.stringify(s))}function hist(){history=history.slice(0,hi+1);history.push(snapshot());if(history.length>40)history.shift();hi=history.length-1}
function restore(s){deselect();C.forEach(c=>groups[c[0]].clearLayers());C.forEach(c=>(s[c[0]]?.features||[]).forEach(f=>add(f,c[0])));render()}
function start(){deselect();drawing=true;Object.values(groups).forEach(g=>g.eachLayer(l=>l.pm.disable()));map.pm.enableDraw('Polygon',{snappable:true,allowSelfIntersection:false})}
function created(e){let l=e.layer,id=$('drawLayer').value;map.pm.disableDraw();drawing=false;map.removeLayer(l);l.feature={type:'Feature',properties:{Name:'New polygon '+n++},geometry:l.toGeoJSON().geometry};l._layer=id;l._fid='new-'+Date.now()+'-'+Math.random();setup(l,id);groups[id].addLayer(l);hist();select(l);status('New polygon added to '+cfg(id)[1]+'.')}
async function load(){for(let c of C){groups[c[0]]=L.featureGroup().addTo(map);try{let r=await fetch('data/'+c[2]);let d=await r.json();(d.features||[]).forEach(f=>add(f,c[0]))}catch(e){status('Could not load '+c[1])}}hist();render()}
function data(){let x={};C.forEach(c=>x[c[1]]=groups[c[0]].getLayers().map(l=>{let f=l.toGeoJSON();f.properties=Object.assign({},l.feature.properties);return f}));return x}
async function login(){try{let r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',password:$('password').value})});let x=await r.json();if(!r.ok||!x.success)throw 0;$('login').style.display='none';$('side').style.display='block';map=L.map('map',{center:[48,37.75],zoom:7});let im=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles © Esri'}),lab=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{attribution:'Labels © Esri'}),hy=L.layerGroup([im,lab]),osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}),top=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{attribution:'© OpenTopoMap'});hy.addTo(map);L.control.layers({'Hybrid':hy,'Satellite':im,'OpenStreetMap':osm,'OpenTopoMap':top}).addTo(map);map.on('click',deselect);map.on('pm:create',created);map.pm.addControls({position:'bottomleft',drawMarker:false,drawCircleMarker:false,drawPolyline:false,drawRectangle:false,drawCircle:false,drawText:false,editMode:false,dragMode:false,cutPolygon:false,removalMode:false,drawPolygon:false});selects();await load()}catch(e){$('err').style.display='block'}}
$('loginbtn').onclick=login;$('password').onkeydown=e=>e.key==='Enter'&&login();$('draw').onclick=start;$('delete').onclick=()=>{if(selected){groups[selected._layer].removeLayer(selected);selected=null;$('selectedBox').style.display='none';hist();render();status('Polygon deleted.')}};$('selectedLayer').onchange=e=>selected&&move(selected,e.target.value);$('search').oninput=render;$('save').onclick=()=>{localStorage.setItem('polrad_editor_data',JSON.stringify(data()));status('Saved in this browser.')};$('download').onclick=()=>{let b=new Blob([JSON.stringify(data(),null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='polrad-edited-data.json';a.click();URL.revokeObjectURL(u)};$('reset').onclick=()=>confirm('Reset all edits?')&&(localStorage.removeItem('polrad_editor_data'),location.reload());$('publish').onclick=async()=>{status('Publishing...');try{let r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'publish',files:data()})});let x=await r.json();if(!r.ok||!x.success)throw new Error(x.error||'Publish failed');status('Published successfully.')}catch(e){status(e.message)}};
</script></body></html>
