<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POLRAD MAPPING — Editor</title>

<!-- Leaflet -->
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<!-- Leaflet Geoman -->
<link
    rel="stylesheet"
    href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.0/dist/leaflet-geoman.css"
/>

<style>

* {
    box-sizing: border-box;
}

html,
body,
#map {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

/* =========================================================
   LOGIN
========================================================= */

#loginScreen {
    position: fixed;
    inset: 0;
    z-index: 99999;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0, 0, 0, 0.88);
}

#loginBox {
    width: 360px;
    max-width: calc(100vw - 30px);

    background: #171717;
    color: white;

    border: 1px solid #444;
    border-radius: 10px;

    padding: 25px;

    box-shadow: 0 10px 40px rgba(0,0,0,.6);
}

#loginBox h2 {
    margin: 0 0 8px;
}

#loginBox p {
    color: #aaa;
    font-size: 13px;
    margin: 0 0 18px;
}

#passwordInput {
    width: 100%;
    height: 40px;

    padding: 0 12px;

    border: 1px solid #555;
    border-radius: 6px;

    background: #252525;
    color: white;

    outline: none;
}

#loginButton {
    width: 100%;
    height: 40px;

    margin-top: 10px;

    border: 1px solid #555;
    border-radius: 6px;

    background: #292929;
    color: white;

    cursor: pointer;
}

#loginButton:hover {
    background: #3a3a3a;
}

#loginButton:disabled {
    opacity: .6;
    cursor: wait;
}

#loginError {
    display: none;

    margin-top: 10px;

    color: #ff6666;
    font-size: 13px;
}

/* =========================================================
   TOOLBAR
========================================================= */

#toolbar {
    position: fixed;

    top: 10px;
    left: 60px;

    z-index: 5000;

    display: none;

    align-items: center;
    gap: 6px;

    padding: 7px;

    background: rgba(20,20,20,.94);

    border: 1px solid rgba(255,255,255,.2);
    border-radius: 8px;

    color: white;

    box-shadow: 0 3px 15px rgba(0,0,0,.4);
}

#toolbarTitle {
    font-weight: bold;
    margin: 0 8px 0 3px;
    white-space: nowrap;
}

.toolButton {
    border: 1px solid #555;

    background: #292929;
    color: white;

    border-radius: 6px;

    padding: 8px 10px;

    cursor: pointer;
}

.toolButton:hover {
    background: #3b3b3b;
}

#status {
    margin-left: 5px;

    color: #aaa;

    font-size: 12px;

    white-space: nowrap;
}

/* =========================================================
   LAYER PANEL
========================================================= */

#layerPanel {
    position: fixed;

    top: 62px;
    left: 60px;

    z-index: 5000;

    display: none;

    width: 300px;
    max-height: calc(100vh - 80px);

    overflow-y: auto;

    padding: 12px;

    background: rgba(20,20,20,.95);

    border: 1px solid rgba(255,255,255,.2);
    border-radius: 8px;

    color: white;

    box-shadow: 0 3px 15px rgba(0,0,0,.4);
}

#layerPanel h3 {
    margin: 0 0 10px;

    font-size: 15px;
}

.layerRow {
    display: flex;
    align-items: center;

    gap: 8px;

    margin: 7px 0;

    font-size: 13px;
}

.layerColor {
    width: 13px;
    height: 13px;

    border-radius: 3px;

    flex-shrink: 0;
}

.layerRow input {
    cursor: pointer;
}

/* =========================================================
   MAP
========================================================= */

#map {
    background: #ddd;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

    #toolbar {
        left: 10px;
        right: 10px;

        flex-wrap: wrap;
    }

    #toolbarTitle {
        width: 100%;
    }

    #layerPanel {
        left: 10px;
        top: 125px;

        width: calc(100vw - 20px);
    }

}

</style>
</head>

<body>

<!-- =========================================================
     MAP
========================================================= -->

<div id="map"></div>


<!-- =========================================================
     LOGIN SCREEN
========================================================= -->

<div id="loginScreen">

    <div id="loginBox">

        <h2>POLRAD MAPPING</h2>

        <p>
            Private editor access
        </p>

        <input
            id="passwordInput"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button id="loginButton">
            Log in
        </button>

        <div id="loginError">
            Incorrect password.
        </div>

    </div>

</div>


<!-- =========================================================
     TOOLBAR
========================================================= -->

<div id="toolbar">

    <span id="toolbarTitle">
        POLRAD MAPPING — EDITOR
    </span>

    <button class="toolButton" id="undoButton">
        ↶ Undo
    </button>

    <button class="toolButton" id="redoButton">
        ↷ Redo
    </button>

    <button class="toolButton" id="deleteButton">
        🗑 Delete
    </button>

    <button class="toolButton" id="layersButton">
        Layers
    </button>

    <button class="toolButton" id="saveButton">
        Save
    </button>

    <button class="toolButton" id="downloadButton">
        Download
    </button>

    <button class="toolButton" id="resetButton">
        Reset
    </button>

    <button class="toolButton" id="publishButton">
        Publish
    </button>

    <span id="status">
        Ready
    </span>

</div>


<!-- =========================================================
     LAYER PANEL
========================================================= -->

<div id="layerPanel">

    <h3>Editable layers</h3>

    <div id="layerList"></div>

</div>


<!-- =========================================================
     LEAFLET
========================================================= -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Geoman -->
<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.0/dist/leaflet-geoman.min.js"></script>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const WORKER_URL =
    "https://polrad-editor-api.streetviewfun066.workers.dev/";


const LAYER_CONFIG = [

    {
        name: "Russian-controlled territory",
        file: "data/Russian-controlled%20territory.geojson",
        color: "#d94b4b"
    },

    {
        name: "Ukrainian-controlled territory",
        file: "data/Ukrainian-controlled%20territory.geojson",
        color: "#4b83d9"
    },

    {
        name: "Ukrainian advances",
        file: "data/Ukrainian%20advances.geojson",
        color: "#6fb7ff"
    },

    {
        name: "Russian advances",
        file: "data/Russian%20advances.geojson",
        color: "#f1c40f"
    },

    {
        name: "Territories regained in the last month",
        file: "data/Territories%20regained%20in%20the%20last%20month.geojson",
        color: "#42b883"
    }

];


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let map = null;

let loggedIn = false;

let selectedLayer = null;

let selectedLayerName = null;

let loadedLayers = {};

let originalData = {};

let undoStack = [];

let redoStack = [];

let isRestoring = false;


/* =========================================================
   DOM
========================================================= */

const loginScreen =
    document.getElementById("loginScreen");

const passwordInput =
    document.getElementById("passwordInput");

const loginButton =
    document.getElementById("loginButton");

const loginError =
    document.getElementById("loginError");

const toolbar =
    document.getElementById("toolbar");

const layerPanel =
    document.getElementById("layerPanel");

const layerList =
    document.getElementById("layerList");

const status =
    document.getElementById("status");


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

    status.textContent = text;

}


/* =========================================================
   LOGIN
========================================================= */

async function attemptLogin() {

    const password =
        passwordInput.value;

    if (!password) {

        loginError.textContent =
            "Please enter the password.";

        loginError.style.display =
            "block";

        return;

    }

    loginButton.disabled = true;

    loginButton.textContent =
        "Checking...";

    loginError.style.display =
        "none";


    try {

        const response =
            await fetch(
                WORKER_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        action: "login",
                        password: password
                    })
                }
            );


        let result;

        try {

            result =
                await response.json();

        } catch {

            throw new Error(
                "Worker returned an invalid response."
            );

        }


        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Login failed."
            );

        }


        /* SUCCESS */

        loggedIn = true;

        loginScreen.style.display =
            "none";

        toolbar.style.display =
            "flex";

        layerPanel.style.display =
            "block";


        initializeMap();


    } catch (error) {

        console.error(
            "Login error:",
            error
        );

        loginError.textContent =
            error.message ||
            "Could not connect to the login server.";

        loginError.style.display =
            "block";

    } finally {

        loginButton.disabled = false;

        loginButton.textContent =
            "Log in";

    }

}


loginButton.addEventListener(
    "click",
    attemptLogin
);


passwordInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            attemptLogin();

        }

    }
);


/* =========================================================
   INITIALIZE MAP
========================================================= */

function initializeMap() {

    if (map) {
        return;
    }


    map = L.map("map", {

        center: [
            48.0,
            37.75
        ],

        zoom: 7,

        zoomControl: true

    });


    /* ESRI SATELLITE */

    const satellite =
        L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                maxZoom: 19,

                attribution:
                    "Tiles © Esri"
            }
        );


    satellite.addTo(map);


    /* GEOMAN CONTROLS */

    map.pm.addControls({

        position: "topleft",

        drawMarker: false,

        drawCircleMarker: false,

        drawPolyline: false,

        drawRectangle: false,

        drawCircle: false,

        drawText: false,

        editMode: false,

        dragMode: false,

        cutPolygon: false,

        removalMode: false

    });


    setStatus(
        "Loading polygons..."
    );


    loadAllLayers();

}


/* =========================================================
   LOAD ALL LAYERS
========================================================= */

async function loadAllLayers() {

    loadedLayers = {};

    originalData = {};


    for (
        const config
        of LAYER_CONFIG
    ) {

        await loadLayer(config);

    }


    buildLayerPanel();

    setStatus(
        "Ready — click a polygon to edit it"
    );

}


/* =========================================================
   LOAD ONE LAYER
========================================================= */

async function loadLayer(config) {

    try {

        const response =
            await fetch(
                config.file +
                "?v=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        originalData[config.name] =
            deepClone(data);


        const geoJsonLayer =
            L.geoJSON(
                data,
                {

                    style: {

                        color: config.color,

                        weight: 1,

                        fillColor:
                            config.color,

                        fillOpacity: 0.45

                    },

                    onEachFeature:
                        function(
                            feature,
                            featureLayer
                        ) {

                            setupPolygon(
                                featureLayer,
                                config.name
                            );

                        }

                }
            );


        geoJsonLayer.addTo(map);


        loadedLayers[config.name] =
            geoJsonLayer;


    } catch (error) {

        console.error(
            "Could not load:",
            config.name,
            error
        );

        setStatus(
            "Error loading " +
            config.name
        );

    }

}


/* =========================================================
   SETUP POLYGON
========================================================= */

function setupPolygon(
    layer,
    layerName
) {

    layer.on(
        "click",
        function(event) {

            L.DomEvent.stopPropagation(
                event
            );

            selectPolygon(
                layer,
                layerName
            );

        }
    );


    layer.on(
        "pm:edit",
        function() {

            if (!isRestoring) {

                saveHistory();

            }

            setStatus(
                "Polygon changed"
            );

        }
    );

}


/* =========================================================
   SELECT POLYGON
========================================================= */

function selectPolygon(
    layer,
    layerName
) {

    /* Disable previous polygon */

    if (selectedLayer) {

        try {

            selectedLayer.pm.disable();

        } catch {}

        selectedLayer.setStyle({

            weight: 1

        });

    }


    selectedLayer =
        layer;

    selectedLayerName =
        layerName;


    /* Highlight */

    selectedLayer.setStyle({

        weight: 4

    });


    /* Enable editing */

    try {

        selectedLayer.pm.enable({
            allowSelfIntersection: false
        });

    } catch (error) {

        console.error(
            "Could not enable editing:",
            error
        );

    }


    setStatus(
        "Editing: " +
        layerName
    );

}


/* =========================================================
   MAP CLICK
========================================================= */

mapClickHandler = null;


/* =========================================================
   LAYER PANEL
========================================================= */

function buildLayerPanel() {

    layerList.innerHTML = "";


    for (
        const config
        of LAYER_CONFIG
    ) {

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "layerRow";


        const checkbox =
            document.createElement(
                "input"
            );

        checkbox.type =
            "checkbox";

        checkbox.checked =
            true;


        checkbox.addEventListener(
            "change",
            function() {

                const layer =
                    loadedLayers[
                        config.name
                    ];

                if (!layer) {
                    return;
                }


                if (checkbox.checked) {

                    map.addLayer(
                        layer
                    );

                } else {

                    map.removeLayer(
                        layer
                    );

                }

            }
        );


        const color =
            document.createElement(
                "span"
            );

        color.className =
            "layerColor";

        color.style.background =
            config.color;


        const label =
            document.createElement(
                "span"
            );

        label.textContent =
            config.name;


        row.appendChild(
            checkbox
        );

        row.appendChild(
            color
        );

        row.appendChild(
            label
        );


        layerList.appendChild(
            row
        );

    }

}


/* =========================================================
   TOGGLE LAYERS
========================================================= */

document
    .getElementById("layersButton")
    .addEventListener(
        "click",
        function() {

            if (
                layerPanel.style.display ===
                "block"
            ) {

                layerPanel.style.display =
                    "none";

            } else {

                layerPanel.style.display =
                    "block";

            }

        }
    );


/* =========================================================
   HISTORY
========================================================= */

function snapshotCurrentState() {

    const snapshot = {};

    for (
        const config
        of LAYER_CONFIG
    ) {

        const layer =
            loadedLayers[
                config.name
            ];

        if (!layer) {
            continue;
        }


        snapshot[
            config.name
        ] =
            layer.toGeoJSON();

    }


    return snapshot;

}


function saveHistory() {

    if (isRestoring) {
        return;
    }


    undoStack.push(
        snapshotCurrentState()
    );


    if (
        undoStack.length >
        50
    ) {

        undoStack.shift();

    }


    redoStack = [];

}


/* =========================================================
   RESTORE SNAPSHOT
========================================================= */

function restoreSnapshot(
    snapshot
) {

    isRestoring = true;


    try {

        for (
            const config
            of LAYER_CONFIG
        ) {

            const oldLayer =
                loadedLayers[
                    config.name
                ];


            if (oldLayer) {

                map.removeLayer(
                    oldLayer
                );

            }


            const data =
                snapshot[
                    config.name
                ];


            if (!data) {
                continue;
            }


            const newLayer =
                L.geoJSON(
                    data,
                    {

                        style: {

                            color:
                                config.color,

                            weight: 1,

                            fillColor:
                                config.color,

                            fillOpacity:
                                0.45

                        },

                        onEachFeature:
                            function(
                                feature,
                                featureLayer
                            ) {

                                setupPolygon(
                                    featureLayer,
                                    config.name
                                );

                            }

                    }
                );


            newLayer.addTo(
                map
            );


            loadedLayers[
                config.name
            ] =
                newLayer;

        }


        selectedLayer =
            null;

        selectedLayerName =
            null;


        setStatus(
            "State restored"
        );


    } finally {

        isRestoring = false;

    }

}


/* =========================================================
   UNDO
========================================================= */

document
    .getElementById("undoButton")
    .addEventListener(
        "click",
        function() {

            if (
                undoStack.length === 0
            ) {

                setStatus(
                    "Nothing to undo"
                );

                return;

            }


            redoStack.push(
                snapshotCurrentState()
            );


            const snapshot =
                undoStack.pop();


            restoreSnapshot(
                snapshot
            );

        }
    );


/* =========================================================
   REDO
========================================================= */

document
    .getElementById("redoButton")
    .addEventListener(
        "click",
        function() {

            if (
                redoStack.length === 0
            ) {

                setStatus(
                    "Nothing to redo"
                );

                return;

            }


            undoStack.push(
                snapshotCurrentState()
            );


            const snapshot =
                redoStack.pop();


            restoreSnapshot(
                snapshot
            );

        }
    );


/* =========================================================
   DELETE SELECTED POLYGON
========================================================= */

document
    .getElementById("deleteButton")
    .addEventListener(
        "click",
        function() {

            if (!selectedLayer) {

                setStatus(
                    "Select a polygon first"
                );

                return;

            }


            if (
                !confirm(
                    "Delete this polygon?"
                )
            ) {

                return;

            }


            saveHistory();


            const parent =
                loadedLayers[
                    selectedLayerName
                ];


            if (parent) {

                parent.removeLayer(
                    selectedLayer
                );

            }


            selectedLayer =
                null;

            selectedLayerName =
                null;


            setStatus(
                "Polygon deleted"
            );

        }
    );


/* =========================================================
   SAVE LOCAL
========================================================= */

document
    .getElementById("saveButton")
    .addEventListener(
        "click",
        function() {

            const data =
                snapshotCurrentState();


            localStorage.setItem(
                "polrad_editor_data",
                JSON.stringify(data)
            );


            setStatus(
                "Saved in this browser"
            );

        }
    );


/* =========================================================
   DOWNLOAD
========================================================= */

document
    .getElementById("downloadButton")
    .addEventListener(
        "click",
        function() {

            const data =
                snapshotCurrentState();


            const output = {

                exportedAt:
                    new Date().toISOString(),

                layers:
                    data

            };


            const blob =
                new Blob(
                    [
                        JSON.stringify(
                            output,
                            null,
                            2
                        )
                    ],
                    {
                        type:
                            "application/json"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;

            link.download =
                "polrad-edited-data.json";


            link.click();


            URL.revokeObjectURL(
                url
            );


            setStatus(
                "Downloaded edited data"
            );

        }
    );


/* =========================================================
   RESET
========================================================= */

document
    .getElementById("resetButton")
    .addEventListener(
        "click",
        async function() {

            if (
                !confirm(
                    "Reset all polygons to the original files?"
                )
            ) {

                return;

            }


            localStorage.removeItem(
                "polrad_editor_data"
            );


            undoStack = [];

            redoStack = [];


            for (
                const config
                of LAYER_CONFIG
            ) {

                const layer =
                    loadedLayers[
                        config.name
                    ];

                if (layer) {

                    map.removeLayer(
                        layer
                    );

                }

            }


            selectedLayer =
                null;

            selectedLayerName =
                null;


            await loadAllLayers();


            setStatus(
                "Reset to original data"
            );

        }
    );


/* =========================================================
   PUBLISH
========================================================= */

document
    .getElementById("publishButton")
    .addEventListener(
        "click",
        async function() {

            if (!loggedIn) {

                setStatus(
                    "You are not logged in"
                );

                return;

            }


            if (
                !confirm(
                    "Publish these changes to the public POLRAD map?"
                )
            ) {

                return;

            }


            const data =
                snapshotCurrentState();


            const files = {};


            for (
                const config
                of LAYER_CONFIG
            ) {

                if (
                    !data[
                        config.name
                    ]
                ) {

                    continue;

                }


                files[
                    config.name
                ] =
                    data[
                        config.name
                    ];

            }


            const publishButton =
                document.getElementById(
                    "publishButton"
                );


            publishButton.disabled =
                true;

            publishButton.textContent =
                "Publishing...";


            setStatus(
                "Publishing..."
            );


            try {

                const response =
                    await fetch(
                        WORKER_URL,
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    action:
                                        "publish",

                                    files:
                                        files

                                })

                        }
                    );


                let result;

                try {

                    result =
                        await response.json();

                } catch {

                    throw new Error(
                        "Worker returned an invalid response."
                    );

                }


                if (
                    !response.ok ||
                    !result.success
                ) {

                    throw new Error(
                        result.error ||
                        "Publishing failed."
                    );

                }


                setStatus(
                    "Published successfully ✓"
                );


            } catch (error) {

                console.error(
                    "Publish error:",
                    error
                );


                setStatus(
                    "Publish failed"
                );


                alert(
                    "Publish failed:\n\n" +
                    error.message
                );


            } finally {

                publishButton.disabled =
                    false;

                publishButton.textContent =
                    "Publish";

            }

        }
    );


/* =========================================================
   HELPER
========================================================= */

function deepClone(object) {

    return JSON.parse(
        JSON.stringify(object)
    );

}


/* =========================================================
   TRY TO RESTORE LOCAL SAVE
========================================================= */

function restoreLocalSave() {

    const stored =
        localStorage.getItem(
            "polrad_editor_data"
        );


    if (!stored) {

        return false;

    }


    try {

        const parsed =
            JSON.parse(stored);


        restoreSnapshot(
            parsed
        );


        setStatus(
            "Restored local save"
        );


        return true;


    } catch (error) {

        console.error(
            "Could not restore local save:",
            error
        );


        localStorage.removeItem(
            "polrad_editor_data"
        );


        return false;

    }

}

</script>

</body>
</html>
