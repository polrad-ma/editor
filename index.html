  function drawAdvancePolygon() {
    if (!advanceState.active) return;

    const layerId =
      advanceState.side === "ru"
        ? "ru_advances"
        : "ua_advances";

    if (!groups[layerId]) {
      alert("The advance layer is not loaded.");
      return;
    }

    // Make sure the target layer is visible so the new polygon can be seen.
    if (typeof setLayerVisible === "function" && layerVisible[layerId] === false) {
      setLayerVisible(layerId, true);
    }

    deselect(false);
    drawing = true;
    window.polradAdvanceDrawing = true;

    map.pm.enableDraw("Polygon", {
      snappable: true,
      allowSelfIntersection: false
    });

    setAdvanceStatus(
      "Drawing the " +
      (advanceState.side === "ru"
        ? "Russian"
        : "Ukrainian") +
      " advance polygon...",
      true
    );

    function onCreate(event) {
      map.off("pm:create", onCreate);

      // If the user switched to the normal Draw tool meanwhile, this polygon
      // belongs to that tool, not to the advance.
      if (!window.polradAdvanceDrawing) return;
      window.polradAdvanceDrawing = false;

      const layer = event.layer;

      map.pm.disableDraw();
      drawing = false;

      map.removeLayer(layer);

      const feature = layer.toGeoJSON();

      const advanceNumber =
        advances.length + 1;

      feature.properties = {
        Name: "Advance " + advanceNumber
      };

      layer.feature = feature;
      layer._layer = layerId;
      layer._fid =
        "advance-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2);

      layer.feature.properties._advanceId = "pending";

      setupPolygon(layer, layerId);
      groups[layerId].addLayer(layer);

      // Cut away any part that lies inside the side's existing territory.
      const trimResult = trimAdvanceToTerritory(layer);

      if (trimResult === "removed") {
        saveHistory();
        renderSidebar();

        setAdvanceStatus(
          "That polygon lies entirely inside already-controlled territory, so it was discarded. Draw another one, or click Finish Advance.",
          true
        );

        return;
      }

      advanceState.createdFids.push(
        layer._fid
      );

      saveHistory();
      renderSidebar();
      ensureAdvanceColors();
      select(layer);

      setAdvanceStatus(
        trimResult === "trimmed"
          ? "Advance polygon created and trimmed so it does not overlap existing territory. You can reshape it with the normal editor handles, then click Finish Advance."
          : "Advance polygon created. You can reshape it with the normal editor handles, then click Finish Advance.",
        true
      );
    }

    map.on("pm:create", onCreate);
  }

  /* ---------------------------------------------------------
     ADVANCE TYPE POPUP
     --------------------------------------------------------- */
  function chooseAdvanceType() {
    return new Promise(function(resolve) {
      const sideName  = advanceState.side === "ru" ? "Russian" : "Ukrainian";
      const otherName = advanceState.side === "ru" ? "Ukrainian" : "Russian";

      const overlay = document.createElement("div");
      overlay.style.cssText =
        "position:fixed;inset:0;z-index:20000;background:rgba(0,0,0,.55);" +
        "display:flex;align-items:center;justify-content:center;";

      overlay.innerHTML =
        '<div style="background:#fff;border-radius:10px;padding:20px;width:380px;max-width:90vw;font-family:Arial,sans-serif">' +
          '<div style="font-weight:700;font-size:16px;margin-bottom:6px">What kind of advance is this?</div>' +
          '<div style="font-size:12px;color:#777;margin-bottom:14px">' + sideName + ' advance</div>' +
          '<button id="advTypeNormal" class="btn primary" style="width:100%;margin-bottom:8px;text-align:left">' +
            '<b>Normal advance</b><br><span style="font-size:11px;font-weight:400">' +
            'Area = size of the new ' + sideName + ' advance polygon</span></button>' +
          '<button id="advTypeGray" class="btn" style="width:100%;margin-bottom:8px;text-align:left">' +
            '<b>Gray zone expansion</b><br><span style="font-size:11px;font-weight:400">' +
            'Area = territory taken away from ' + otherName + ' control</span></button>' +
          '<button id="advTypeCancel" class="btn" style="width:100%">Cancel</button>' +
        '</div>';

      document.body.appendChild(overlay);

      function done(value) {
        overlay.remove();
        resolve(value);
      }

      overlay.querySelector("#advTypeNormal").onclick = function() { done("normal"); };
      overlay.querySelector("#advTypeGray").onclick   = function() { done("gray"); };
      overlay.querySelector("#advTypeCancel").onclick = function() { done(null); };
    });
  }

  // Area (km²) of the advance polygons created during this advance.
  function createdPolygonsAreaKm2() {
    let total = 0;

    advanceState.createdFids.forEach(function(fid) {
      const layer = findPolygon(fid);
      if (!layer) return;
      try { total += turf.area(layer.toGeoJSON()); } catch (e) {}
    });

    return total / 1000000;
  }

  // normal: + area of the new polygon(s), for the advancing side
  // gray:   - area lost by the OTHER side (its controlled area shrank)
  function computeAdvanceEffects() {
    if (advanceState.type === "gray") {
      const other = advanceState.side === "ru" ? "ua" : "ru";
      const after = currentControlledAreas();
      const diff = Number((after[other] - advanceState.before[other]).toFixed(2));

      return Math.abs(diff) >= 0.005 ? [{ side: other, value: diff }] : [];
    }

    const value = Number(createdPolygonsAreaKm2().toFixed(2));
    return value >= 0.005 ? [{ side: advanceState.side, value: value }] : [];
  }

  function renderAreaPreview() {
    const effects = advanceState.lastEffects;
    const box = A("advanceAreaPreview");

    if (!effects || !box) return;

    const label = advanceState.type === "gray"
      ? "Gray zone expansion – area lost by " +
        (advanceState.side === "ru" ? "Ukraine" : "Russia")
      : "Advance polygon area";

    box.innerHTML =
      '<div style="font-size:11px;color:#777;margin-bottom:3px">' + label + "</div>" +
      formatAreaEffects(effects, A("advanceColor").value) +
      '<div style="margin-top:5px;color:#777;font-size:11px">' +
      "This color is used for the area text on the public map." +
      "</div>";
  }

  async function finishAdvance() {
    if (!advanceState.active) return;

    const type = await chooseAdvanceType();
    if (!type) return;               // cancelled: stay in advance mode

    advanceState.type = type;
    advanceState.focus = currentFocus();

    // Only a normal advance polygon needs trimming against own territory.
    const trimNote = type === "normal" ? trimCreatedAdvances() : "";

    generateGrayZone();

    advanceState.lastEffects = computeAdvanceEffects();

    // Gray zone expansion: text uses the color of the side that LOSES control
    // (Russia advances -> Ukraine loses -> blue; Ukraine advances -> red).
    // Normal advance: color of the advancing side.
    const losingIsBlue = advanceState.side === "ru";
    A("advanceColor").value =
      type === "gray"
        ? (losingIsBlue ? "blue" : "red")
        : (advanceState.side === "ua" ? "blue" : "red");

    renderAreaPreview();

    A("advanceTextWrap").style.display = "block";
    A("advanceFinish").disabled = true;
    A("advanceText").focus();

    setAdvanceStatus(
      trimNote
        ? "Area calculated (" + trimNote + "). Write the update text and click Save Advance."
        : "Area calculated. Write the update text and click Save Advance.",
      false
    );
  }

  function saveAdvance() {
    if (!advanceState.active) return;

    const text =
      A("advanceText").value.trim();

    if (!text) {
      alert("Please enter the advance description.");
      A("advanceText").focus();
      return;
    }

    const now = dateTimeNow();

    const effects = computeAdvanceEffects();
    const primaryValue = effects.length ? effects[0].value : 0;

    const id =
      "adv-" +
      Date.now();

    advanceState.createdFids.forEach(
      function(fid) {
        const layer =
          findPolygon(fid);

        if (
          layer &&
          layer.feature &&
          layer.feature.properties
        ) {
          layer.feature.properties._advanceId =
            id;
        }
      }
    );

    // Make sure the snapshot contains the final edited geometry.
    generateGrayZone();

    const snapshot =
      getCurrentGeoJSON();

    const item = {
      id: id,
      date: now.date,
      time: now.time,
      text: text,
      side: advanceState.side,
      advanceType: advanceState.type,

      areaChange:
        Number(primaryValue.toFixed(2)),

      areaEffects: effects,

      areaDisplay:
        areaDisplay(effects),

      areaColor:
        A("advanceColor").value,

      focus:
        advanceState.focus,

      polygonFids:
        advanceState.createdFids.slice(),

      snapshot:
        "history/advances/" +
        id +
        ".json",

      snapshotData:
        snapshot,

      beforeAreas:
        advanceState.before
    };

    advances.push(item);
    saveAdvances();

    // Keep normal editor Save/local persistence working.
    localStorage.setItem(
      "polrad_editor_data",
      JSON.stringify(
        getCurrentGeoJSON()
      )
    );

    renderAdvanceHistory();

    advanceState.active = false;
    advanceState.type = "normal";
    advanceState.before = null;
    advanceState.focus = null;
    advanceState.createdFids = [];

    A("advanceStart").disabled = false;
    A("advanceFinish").disabled = true;
    A("advanceSide").disabled = false;

    A("advanceTextWrap").style.display =
      "none";

    A("advanceText").value = "";

    const polygonRow =
      A("advancePolygonRow");

    if (polygonRow) {
      polygonRow.remove();
    }

    setAdvanceStatus(
      "Advance saved. Click the normal Publish button to send the map and advance history to GitHub.",
      false
    );

    renderSidebar();
  }

  function cancelAdvance() {
    window.polradAdvanceDrawing = false;
    if (!advanceState.active) return;

    advanceState.active = false;
    advanceState.type = "normal";
    advanceState.before = null;
    advanceState.focus = null;
    advanceState.createdFids = [];

    A("advanceStart").disabled = false;
    A("advanceFinish").disabled = true;
    A("advanceSide").disabled = false;

    A("advanceTextWrap").style.display =
      "none";

    A("advanceText").value = "";

    const polygonRow =
      A("advancePolygonRow");

    if (polygonRow) {
      polygonRow.remove();
    }

    setAdvanceStatus(
      "Advance cancelled. Any map geometry you changed remains changed; use Undo if necessary.",
      false
    );
  }

  /* ---------------------------------------------------------
     DELETE ADVANCE
     --------------------------------------------------------- */
  function deleteAdvance(id) {
    const item = advances.find(function(a) { return a.id === id; });
    if (!item) return;

    if (!confirm(
      "Delete this advance from the history?\n\n" +
      item.date + " " + item.time + "\n" + (item.text || "")
    )) return;

    const alsoPolygons = confirm(
      "Also remove this advance's polygon(s) from the map?\n\n" +
      "OK = remove polygons too\nCancel = keep polygons, delete only the history entry"
    );

    let removed = 0;

    if (alsoPolygons) {
      ADVANCE_LAYER_IDS.forEach(function(layerId) {
        if (!groups[layerId]) return;

        groups[layerId].getLayers().slice().forEach(function(layer) {
          const p = layer.feature && layer.feature.properties;
          const byId  = p && p._advanceId === id;
          const byFid = (item.polygonFids || []).indexOf(layer._fid) !== -1;

          if (byId || byFid) {
            if (layer === selected) deselect(false);
            groups[layerId].removeLayer(layer);
            removed++;
          }
        });
      });
    }

    advances = advances.filter(function(a) { return a.id !== id; });
    saveAdvances();

    if (alsoPolygons) {
      saveHistory();
      renderSidebar();
      generateGrayZone();
    }

    renderAdvanceHistory();
    setStatus(
      "Advance deleted" +
      (alsoPolygons ? " (" + removed + " polygon(s) removed)" : "") +
      ". Click Publish to update the public map."
    );
  }

  function renderAdvanceHistory() {
    const box = A("advanceHistory");
    if (!box) return;

    box.innerHTML = "";

    if (!advances.length) {
      box.innerHTML =
        '<div class="small">No advance history saved in this browser yet.</div>';
      return;
    }

    advances.slice().reverse().forEach(function(item) {
      const row = document.createElement("div");
      row.className = "advance-history-item";

      const sideLabel = item.side === "ru" ? "🔴 Russia" : "🔵 Ukraine";
      const typeLabel = item.advanceType === "gray" ? " · Gray zone expansion" : "";
      const color =
        (item.areaColor || (item.side === "ua" ? "blue" : "red")) === "blue"
          ? "#1e88e5" : "#e53935";

      row.innerHTML =
        '<button type="button" class="adv-del" style="color:#b3261e;margin-left:4px">Delete</button>' +
        '<button type="button" class="adv-edit">Edit</button>' +
        '<div class="advance-history-date">' +
        item.date + " " + item.time + " · " + sideLabel + typeLabel +
        "</div>" +
        "<div>" + (item.text || "") + "</div>" +
        (item.areaDisplay
          ? '<div>Area: <span style="font-weight:700;color:' + color + '">' +
            item.areaDisplay + "</span></div>"
          : "");

      row.querySelector(".adv-edit").onclick = function() { editAdvance(item.id); };
      row.querySelector(".adv-del").onclick  = function() { deleteAdvance(item.id); };

      box.appendChild(row);
    });
  }

  function editAdvance(id) {
    const item =
      advances.find(function(a) {
        return a.id === id;
      });

    if (!item) return;

    const newText =
      prompt(
        "Edit advance text:",
        item.text || ""
      );

    if (newText === null) return;

    const cleanText =
      newText.trim();

    if (cleanText) {
      item.text = cleanText;
    }

    const side =
      prompt(
        "Side: enter ru or ua",
        item.side || "ru"
      );

    if (side === "ru" || side === "ua") {
      item.side = side;
    }

    const colorAnswer =
      prompt(
        "Area change color: enter red or blue",
        item.areaColor || (item.side === "ua" ? "blue" : "red")
      );

    if (colorAnswer) {
      const c = colorAnswer.trim().toLowerCase();
      if (c === "red" || c === "blue") {
        item.areaColor = c;
      }
    }

    /*
      Area values are normally calculated automatically.
      The manual area edit below is only a correction tool for cases where
      the editor cannot produce a clean Turf union because of invalid or
      overlapping geometry.
    */
    const areaAnswer =
      prompt(
        "Optional manual area correction in km². Leave blank to keep the calculated area:",
        item.areaChange !== undefined &&
        item.areaChange !== null
          ? String(item.areaChange)
          : ""
      );

    if (
      areaAnswer !== null &&
      areaAnswer.trim() !== ""
    ) {
      const n =
        Number(
          areaAnswer
            .replace(",", ".")
        );

      if (Number.isFinite(n)) {
        item.areaChange =
          Number(n.toFixed(2));

        // Gray zone entries store the loss under the OTHER side,
        // so keep whichever side the effect was originally stored under.
        const effectSide =
          item.areaEffects && item.areaEffects[0]
            ? item.areaEffects[0].side
            : item.side;

        item.areaEffects = [{ side: effectSide, value: item.areaChange }];

        item.areaDisplay =
          (
            n > 0
              ? "+"
              : ""
          ) +
          n.toFixed(2) +
          " km²";
      }
    }

    // Select the polygon associated with this advance so the normal
    // Geoman handles can be used to reshape it.
    const fids =
      item.polygonFids || [];

    if (fids.length) {
      const polygon =
        findPolygon(fids[0]);

      if (polygon) {
        select(polygon);

        setStatus(
          "Advance polygon selected. Reshape it with the normal editor handles, then Publish."
        );
      }
    }

    saveAdvances();
    renderAdvanceHistory();
  }

  /*
   * Replace the normal Publish button with a version that sends:
   *
   * files
   * advances
   * advanceSnapshots
   *
   * The normal map publishing behavior remains the same.
   */
  function installAdvancePublish() {
    const publish =
      A("publish");

    if (!publish) return;

    if (publish.dataset.advancePublishInstalled === "1") {
      return;
    }

    publish.dataset.advancePublishInstalled = "1";

    publish.onclick =
      async function() {
        setStatus(
          "Publishing map and advance history..."
        );

        try {
          const currentFiles =
            getCurrentGeoJSON();

          const advanceSnapshots =
            {};

          advances.forEach(
            function(item) {
              advanceSnapshots[item.id] =
                item.snapshotData || null;
            }
          );

          const response =
            await fetch(
              WORKER,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    action: "publish",

                    files:
                      currentFiles,

                    advances:
                      advances,

                    advanceSnapshots:
                      advanceSnapshots
                  })
              }
            );

          const result =
            await response.json();

          if (
            !response.ok ||
            !result.success
          ) {
            throw new Error(
              result.error ||
              "Publish failed."
            );
          }

          localStorage.setItem(
            "polrad_editor_data",
            JSON.stringify(
              currentFiles
            )
          );

          saveAdvances();

          setStatus(
            "Published successfully, including advance history."
          );

          alert(
            "Published successfully!"
          );

        } catch (error) {
          setStatus(
            error.message ||
            "Publish failed."
          );
        }
      };
  }

  function initAdvanceEditor() {
    addAdvanceCSS();
    loadAdvances();
    createAdvanceUI();
    ensureAdvanceColors();
    installAdvancePublish();
    renderAdvanceHistory();
  }

  /*
   * The original editor defines all of its functions in the global script.
   * Wait a little so those definitions and the login UI exist.
   */
  if (
    document.readyState ===
    "loading"
  ) {
    document.addEventListener(
      "DOMContentLoaded",
      function() {
        setTimeout(
          initAdvanceEditor,
          150
        );
      }
    );
  } else {
    setTimeout(
      initAdvanceEditor,
      150
    );
  }

})();
</script>
